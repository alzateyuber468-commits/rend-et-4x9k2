      '<div class="tablabox"><table class="tabla"><thead><tr><th>Líder</th><th class="num">Cosechadores</th>'+
      '<th class="num">'+esc(etiqG)+'</th><th class="num">Calidad</th><th class="num">Acumulado año</th><th></th></tr></thead><tbody>'+filas+
      '</tbody></table></div></section>';

    /* --- apoyos: un solo grupo aparte, por labor, sin mezclar con ningún líder --- */
    var apoyos=idx.personas.filter(function(p){ return p.activo&&!p.cosecha; });
    var porLabor=new Map();
    apoyos.forEach(function(p){
      if(!porLabor.has(p.labor)) porLabor.set(p.labor,[]);
      porLabor.get(p.labor).push(p);
    });
    var filasA="";
    Array.from(porLabor.keys()).sort(function(a,b){ return a.localeCompare(b,"es"); }).forEach(function(lab){
      var ps=porLabor.get(lab);
      var regs=[]; ps.forEach(function(p){ var h=idx.porPersona.get(p.i); if(h) regs=regs.concat(h); });
      var an=agrega(regs), perA=agrega(regs.filter(filtroG));
      filasA+='<tr><td>'+esc(lab)+'</td><td class="num">'+fInt(ps.length)+'</td>'+
        '<td class="num fuerte">'+fInt(perA.r)+'</td><td class="num">'+fPct(perA.cf)+'</td>'+
        '<td class="num">'+fInt(an.r)+'</td></tr>';
    });
    s+='<section class="tarj"><h3 class="tarjtit">Apoyos, aparte de la base de cosecha'+
      '<span class="tarjsub">'+fInt(apoyos.length)+' personas activas en labores distintas a cosecha, agrupadas por su labor · '+esc(etiqG)+'</span></h3>'+
      (filasA?('<div class="tablabox"><table class="tabla"><thead><tr><th>Labor</th><th class="num">Personas</th>'+
        '<th class="num">'+esc(etiqG)+'</th><th class="num">Calidad</th><th class="num">Acumulado año</th></tr></thead><tbody>'+filasA+'</tbody></table></div>')
        :'<div class="vacio">Sin personas en apoyos.</div>')+'</section>';

    var serieS=idx.semOrd.slice(0,20).reverse().map(function(x){
      return { k:x, label:String(x).slice(2), v:agrega(idx.regs.filter(function(r){ return r.sem===x; })).r };
    });
    s+='<section class="tarj"><h3 class="tarjtit">Rendimiento de la finca por semana'+
      '<span class="tarjsub">todas las personas de la base, cosecha y apoyos juntos</span></h3>'+
      svgBarras(serieS,{refLinea:tot.r,etiquetaRef:"prom. base"})+'</section>';

    /* --- personas: buscador con filtro por estado --- */
    var filtroEstado=E.estadoFiltro||"activos";
    var listaP=idx.personas.filter(function(p){
      if(filtroEstado==="activos") return p.activo;
      if(filtroEstado==="retirados") return !p.activo;
      return true;
    });
    if(E.buscarPersona){
      var q=norm(E.buscarPersona);
      listaP=listaP.filter(function(p){ return norm(p.nom).indexOf(q)>=0; });
    }
    listaP=listaP.slice().sort(function(a,b){ return a.nom.localeCompare(b.nom,"es"); });
    var filasP="";
    listaP.slice(0,200).forEach(function(p){
      var h=idx.porPersona.get(p.i)||[];
      var ult2=h.length?h[h.length-1]:null;
      filasP+='<tr><td>'+esc(p.nom)+'</td><td class="num">'+p.cod+'</td>'+
        '<td>'+(p.activo?'<span class="chipcal c-ok">LABORANDO</span>':'<span class="chipcal c-no">RETIRADO</span>')+'</td>'+
        '<td>'+esc(p.labor)+(p.cosecha?"":'<span class="tag">apoyo</span>')+'</td>'+
        '<td>'+esc(p.lider)+'</td>'+
        '<td>'+(ult2?dmy(ult2.ms):"—")+'</td>'+
        '<td><button class="btn btn-mini" data-verpersona="'+p.i+'">Ver detalle</button></td></tr>';
    });
    s+='<section class="tarj"><h3 class="tarjtit">Buscar personas'+
      '<span class="tarjsub">activas, retiradas, o todas · '+fInt(listaP.length)+' encontradas'+
      (listaP.length>200?" (mostrando 200)":"")+'</span></h3>'+
      '<div class="barrafiltros"><div class="grupo">'+
      [["activos","Laborando"],["retirados","Retirados"],["todos","Todos"]].map(function(x){
        return '<button class="chip'+(filtroEstado===x[0]?" chip-on":"")+'" data-estado="'+x[0]+'">'+x[1]+'</button>';
      }).join("")+'</div><div class="grupo">'+
      '<input class="inp inp-mini inp-per" id="buscarpersona" type="text" placeholder="Buscar por nombre…" value="'+esc(E.buscarPersona||"")+'">'+
      '</div></div>'+
      (filasP?('<div class="tablabox"><table class="tabla"><thead><tr><th>Nombre</th><th class="num">Código</th>'+
        '<th>Estado</th><th>Labor</th><th>Líder</th><th>Último registro</th><th></th></tr></thead><tbody>'+filasP+'</tbody></table></div>')
        :'<div class="vacio">Sin resultados.</div>')+'</section>';
  }

  if(E.pestana==="usuarios"){
    if(!idx) return s+'<div class="vacio">Carga primero los datos.</div></div>';
    var us=listaUsuarios();
    var pinPorLider={};
    us.forEach(function(u){ pinPorLider[u.lider]=String(u.pin); });
    var enDatos=idx.lideres.slice();
    us.forEach(function(u){ if(enDatos.indexOf(u.lider)<0) enDatos.push(u.lider); });
    enDatos.sort(function(a,b){ return a.localeCompare(b,"es"); });

    var filasU="";
    enDatos.forEach(function(l,i){
      var personas=idx.equipos.get(l)||[];
      var act=personas.filter(function(p){ return p.activo&&p.cosecha; }).length;
      var otros=personas.filter(function(p){ return p.activo&&!p.cosecha; }).length;
      var tiene=pinPorLider[l]!=null;
      filasU+='<tr><td>'+esc(l)+(personas.length?"":'<span class="tag">sin registros en la base</span>')+'</td>'+
        '<td class="num">'+fInt(act)+'</td><td class="num">'+fInt(otros)+'</td>'+
        '<td>'+(tiene
          ? '<input class="inp inp-mini inp-pin" id="pin_'+i+'" type="text" inputmode="numeric" maxlength="6" value="'+esc(pinPorLider[l])+'">'
          : '<span class="mini">sin usuario</span>')+'</td>'+
        '<td>'+(tiene
          ? '<button class="btn btn-mini" data-guardarpin="'+i+'" data-lider="'+esc(l)+'">Guardar PIN</button> '+
            '<button class="btn btn-mini" data-quitaruser="'+esc(l)+'">Quitar</button>'
          : '<button class="btn btn-mini" data-crearuser="'+esc(l)+'">Crear usuario (PIN '+pinLibre()+')</button>')+
        '</td></tr>';
    });

    s+='<section class="tarj"><h3 class="tarjtit">Usuarios de los líderes'+
      '<span class="tarjsub">se guardan dentro de datos.json y viajan al sitio en la próxima subida</span></h3>'+
      '<div class="tablabox"><table class="tabla"><thead><tr><th>Líder</th><th class="num">En cosecha</th>'+
      '<th class="num">Otra labor</th><th>PIN</th><th>Acción</th></tr></thead><tbody>'+filasU+
      '</tbody></table></div></section>'+
      '<section class="tarj"><h3 class="tarjtit">Tu PIN de administrador'+
      '<span class="tarjsub">si lo cambias y lo olvidas hay que volver a subir el index.html</span></h3>'+
      '<div class="metas"><label class="lblmini" for="pinadmin">PIN</label>'+
      '<input class="inp inp-mini inp-pin" id="pinadmin" type="text" inputmode="numeric" maxlength="6" value="'+esc(pinAdmin())+'">'+
      '<button class="btn btn-mini" id="guardarpinadmin">Guardar</button></div></section>';
    if(E.mensaje) s+='<div class="'+(E.mensaje.tipo==="ok"?"ok":"err")+'">'+esc(E.mensaje.txt)+'</div>';
    s+='<div class="vacio">Después de cambiar usuarios o PIN, ve a la pestaña de datos, descarga <b>datos.json</b> y súbelo al sitio. Hasta que no lo subas, el cambio solo existe en este equipo.</div>';
  }

  if(E.pestana==="lider"){
    if(!idx) return s+'<div class="vacio">Carga primero los datos.</div></div>';
    s+='<section class="tarj"><h3 class="tarjtit">Abrir el tablero de un líder'+
      '<span class="tarjsub">misma vista que ve el líder en su tablet</span></h3><div class="grupo grupo-wrap">'+
      idx.lideres.map(function(l){ return '<button class="btn btn-sec" data-vercomo="'+esc(l)+'">'+esc(l)+'</button>'; }).join("")+
      '</div></section>';
  }
  return s+"</div>";
}

/* ------------------------------ render y eventos ------------------------------ */

function render(){
  var root=document.getElementById("root");
  if(!E.sesion) root.innerHTML=vistaLogin();
  else if(E.idx&&E.mostrar!=null) root.innerHTML=vistaCosechador(E.idx.personas[E.mostrar]);
  else if(E.sesion.tipo==="admin"&&!E.verComo) root.innerHTML=vistaAdmin();
  else if(E.sesion.tipo==="apoyos") root.innerHTML=vistaLider("__APOYOS__",false);
  else root.innerHTML=vistaLider(E.verComo||E.sesion.lider,!!E.verComo);
  conectar();
  window.scrollTo(0,0);
}
function on(id,ev,fn){ var el=document.getElementById(id); if(el) el.addEventListener(ev,fn); }

function validarTexto(t){
  var res=parsearTexto(t);
  if(res.error){ E.previo=null; E.mensaje={tipo:"err",txt:res.error}; }
  else{
    E.previo=res;
    E.mensaje={tipo:"ok",txt:"Estructura válida · "+fInt(res.ds.meta.registros)+" registros · "+
      fInt(res.ds.meta.personas)+" personas · "+(res.errores.length?(res.errores.length+" filas rechazadas"):"sin filas rechazadas")};
  }
  render();
}
function aplicar(modo){
  if(!E.previo) return;
  var dsFinal=E.previo.ds, detalle=fInt(E.previo.ds.meta.registros)+" registros";
  if(modo==="fusionar"&&E.ds){
    var f=fusionar(E.ds,E.previo.ds);
    dsFinal=f.ds;
    detalle=fInt(f.nuevos)+" nuevos, "+fInt(f.reemplazados)+" corregidos, base en "+fInt(f.ds.meta.registros)+" registros";
  }
  heredarConfig(dsFinal,E.ds); // conserva metas, usuarios y PIN
  var r=guardar(dsFinal);
  E.previo=null;
  E.mensaje={ tipo:"ok", txt:(modo==="fusionar"?"Base fusionada":"Base reemplazada")+": "+detalle+" ("+
    (r.bytes/1048576).toFixed(2)+" MB)."+(r.ok?"":" No se pudo guardar en este navegador: exporta el tablero del día para no perderlo.") };
  render();
}

function conectar(){
  on("entrar","click",function(){
    var u=document.getElementById("u").value, p=document.getElementById("p").value;
    var err=document.getElementById("loginerr");
    if(!u){ err.innerHTML='<div class="err">Elige tu usuario.</div>'; return; }
    if(u==="__APOYOS__"){ E.sesion={tipo:"apoyos"}; E.vista="apoyos"; E.personaSel=null; E.dRef=null; render(); return; }
    var esperado=(u==="__ADMIN__")?pinAdmin():null;
    if(esperado===null){
      listaUsuarios().forEach(function(x){ if(x.lider===u) esperado=String(x.pin); });
    }
    if(!esperado||p!==esperado){ err.innerHTML='<div class="err">PIN incorrecto.</div>'; return; }
    E.sesion=(u==="__ADMIN__")?{tipo:"admin"}:{tipo:"lider",lider:u};
    render();
  });
  on("p","keydown",function(e){ if(e.key==="Enter"){ var b=document.getElementById("entrar"); if(b) b.click(); } });
  on("salir","click",function(){ E.sesion=null; E.verComo=""; E.personaSel=null; render(); });
  on("volveradmin","click",function(){ E.verComo=""; E.personaSel=null; render(); });
  on("volverequipo","click",function(){ E.personaSel=null; render(); });

  });
  on("fdetclave","change",function(e){ E.detClave=+e.target.value; render(); });
  document.querySelectorAll("[data-orden]").forEach(function(b){
    b.addEventListener("click",function(){ E.orden=b.getAttribute("data-orden"); render(); });
  });
  document.querySelectorAll("[data-cump]").forEach(function(b){
    b.addEventListener("click",function(){ E.cump=b.getAttribute("data-cump"); render(); });
  });
  document.querySelectorAll("[data-periodo]").forEach(function(b){
    b.addEventListener("click",function(){ E.periodo=b.getAttribute("data-periodo"); render(); });
  });
  document.querySelectorAll("[data-pestana]").forEach(function(b){
    b.addEventListener("click",function(){ E.pestana=b.getAttribute("data-pestana"); render(); });
  });
  document.querySelectorAll("[data-vercomo]").forEach(function(b){
    b.addEventListener("click",function(){ E.verComo=b.getAttribute("data-vercomo"); E.personaSel=null; E.dRef=null; render(); });
  });
  document.querySelectorAll("[data-persona]").forEach(function(b){
    b.addEventListener("click",function(){
      E.personaSel=+b.getAttribute("data-persona");
      E.detPeriodo="dia"; E.detClave=null; render();
    });
  });
  on("fdia","change",function(e){ E.dRef=+e.target.value; render(); });
  on("fsem","change",function(e){ E.semFiltro=e.target.value; render(); });
  on("flabor","change",function(e){ E.laborFiltro=e.target.value; E.personaSel=null; render(); });
  on("fmes","change",function(e){ E.mesFiltro=e.target.value; render(); });
  on("fanio","change",function(e){ E.anioFiltro=e.target.value; render(); });
  on("fper","change",function(e){
    E.personaSel=e.target.value===""?null:+e.target.value;
    E.detPeriodo="dia"; E.detClave=null; render();
  });

  on("validar","click",function(){ validarTexto(document.getElementById("pegado").value); });
  on("pegado","paste",function(e){
    var t=e.clipboardData?e.clipboardData.getData("text"):"";
    if(t){ e.preventDefault(); e.target.value=t; setTimeout(function(){ validarTexto(t); },0); }
  });
  on("fusionar","click",function(){ aplicar("fusionar"); });
  on("reemplazar","click",function(){ aplicar("reemplazar"); });
  on("limpiar","click",function(){ E.previo=null; E.mensaje=null; render(); });
  on("filearch","change",function(e){ leerArchivo(e,function(t){ validarTexto(t); }); });
  document.querySelectorAll("[data-guardarpin]").forEach(function(b){
    b.addEventListener("click",function(){
      var i=b.getAttribute("data-guardarpin"), lider=b.getAttribute("data-lider");
      var val=String(document.getElementById("pin_"+i).value||"").trim();

      if(val===pinAdmin()){ alert("Ese PIN es el del administrador. Usa otro."); return; }
      var choque=listaUsuarios().filter(function(u){ return u.lider!==lider&&String(u.pin)===val; });
      if(choque.length){ alert("Ese PIN ya lo tiene "+choque[0].lider+"."); return; }
      asegurarUsuarios();
      E.ds.meta.usuarios.forEach(function(u){ if(u.lider===lider) u.pin=val; });
      guardar(E.ds);
      E.mensaje={tipo:"ok",txt:"PIN de "+lider+" cambiado a "+val+". Descarga datos.json y súbelo para que aplique en las tablets."};

  document.querySelectorAll("[data-crearuser]").forEach(function(b){
    b.addEventListener("click",function(){

      var pin=pinLibre();
      E.ds.meta.usuarios.push({ lider:lider, pin:pin });
      guardar(E.ds);
      E.mensaje={tipo:"ok",txt:"Usuario creado para "+lider+" con PIN "+pin+". Puedes cambiarlo en la tabla. Recuerda subir datos.json."};
      render();
    });

  document.querySelectorAll("[data-quitaruser]").forEach(function(b){

      var lider=b.getAttribute("data-quitaruser");

      asegurarUsuarios();
      E.ds.meta.usuarios=E.ds.meta.usuarios.filter(function(u){ return u.lider!==lider; });
      guardar(E.ds);
      E.mensaje={tipo:"ok",txt:"Usuario de "+lider+" eliminado. Recuerda subir datos.json."};
      render();
    });
  });
  on("fsemboni","change",function(e){
    E.semFiltro=e.target.value; render();
  });
  on("buscarboni","input",function(e){
    E.buscarBoni=e.target.value;
    var pos=e.target.selectionStart;
    render();
    var el=document.getElementById("buscarboni");
    if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(err){} }
  });
  document.querySelectorAll("[data-genper]").forEach(function(b){
    b.addEventListener("click",function(){ E.generalPeriodo=b.getAttribute("data-genper"); E.generalClave=null; render(); });
  });
  on("fgenclave","change",function(e){ E.generalClave=+e.target.value; render(); });
  document.querySelectorAll("[data-verpersona]").forEach(function(b){

  on("volveradminpersona","click",function(){ E.adminPersonaSel=null; render(); });
  document.querySelectorAll("[data-estado]").forEach(function(b){
    b.addEventListener("click",function(){ E.estadoFiltro=b.getAttribute("data-estado"); render(); });
  });
  on("buscarpersona","input",function(e){
    E.buscarPersona=e.target.value;
    var pos=e.target.selectionStart;
    render();
    var el=document.getElementById("buscarpersona");
    if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(err){} }
  });
  on("guardarpinadmin","click",function(){
    var val=String(document.getElementById("pinadmin").value||"").trim();
    if(!/^\d{4,6}$/.test(val)){ alert("El PIN debe tener entre 4 y 6 dígitos."); return; }
    if(listaUsuarios().some(function(u){ return String(u.pin)===val; })){ alert("Ese PIN ya lo tiene un líder."); return; }
    asegurarUsuarios();
    E.ds.meta.pinAdmin=val;
    guardar(E.ds);
    E.mensaje={tipo:"ok",txt:"Tu PIN de administrador es ahora "+val+". Anótalo: si lo olvidas hay que volver a subir el index.html."};
    render();
  });
  document.querySelectorAll("[data-respaldo]").forEach(function(b){
    b.addEventListener("click",function(){
      var c=+b.getAttribute("data-respaldo");
      var filas=expandir(E.ds).filter(function(f){ return Math.floor(f.sem/100)===c; });
      if(!filas.length){ alert("No hay registros de ese ciclo."); return; }
      var ds2=heredarConfig(construirDesdeFilas(filas),E.ds);
      ds2.meta.respaldoDe="ciclo 20"+c;
      descargar(JSON.stringify(ds2),"datos-20"+c+"-cierre.json");
    });
  });
  on("depurar","click",function(){
    var n=+document.getElementById("nciclos").value;
    var ciclos=Array.from(new Set(E.idx.regs.map(function(r){ return r.ciclo; }))).sort(function(a,b){ return b-a; });
    var conservar=ciclos.slice(0,n);
    var fuera=ciclos.slice(n);
    if(!fuera.length){ alert("La base solo tiene "+ciclos.length+" ciclo(s). No hay nada que depurar."); return; }
    var filas=expandir(E.ds);
    var quedan=filas.filter(function(f){ return conservar.indexOf(Math.floor(f.sem/100))>=0; });
    var msg="Se van a eliminar del tablero los ciclos "+fuera.map(function(c){ return "20"+c; }).join(", ")+
      ": "+fInt(filas.length-quedan.length)+" registros.\n\nQuedan "+fInt(quedan.length)+" registros de "+
      conservar.map(function(c){ return "20"+c; }).join(", ")+".\n\n¿Descargaste ya los respaldos? Esta acción no se puede deshacer sin ellos.";
    if(!confirm(msg)) return;
    var ds2=heredarConfig(construirDesdeFilas(quedan),E.ds);
    var g=guardar(ds2);
    E.mensaje={tipo:"ok",txt:"Base depurada: "+fInt(quedan.length)+" registros, "+(g.bytes/1048576).toFixed(2)+
      " MB. Descarga datos.json y súbelo al sitio para que los líderes vean la base depurada."};
    render();
  });
  on("guardarmetas","click",function(){
    if(!E.ds) return;
    var r=+document.getElementById("metar").value, c=+document.getElementById("metac").value;
    var dd=+document.getElementById("metad").value;
    if(!(r>0)||!(c>0&&c<=100)){ alert("Revisa las metas: rendimiento en esquejes por hora y calidad en porcentaje."); return; }
    if(!(dd>=7&&dd<=180)){ alert("Los días sin cosechar deben estar entre 7 y 180."); return; }
    E.ds.meta.metaRend=Math.round(r);
    E.ds.meta.metaCal=c/100;
    E.ds.meta.diasDormido=Math.round(dd);
    var g=guardar(E.ds);
    E.mensaje={tipo:"ok",txt:"Guardado: meta "+fInt(r)+" esq/h, calidad "+nf1.format(c)+"%, y "+Math.round(dd)+
      " días para marcar a alguien como sin cosechar. Sube datos.json para que los líderes lo vean."+(g.ok?"":" No se pudo guardar localmente.")};
    render();
  });
  on("exphtml","click",exportarTablero);
  on("expjson","click",function(){
    descargar(JSON.stringify(E.ds),"datos.json");
  });

  on("actualizar","click",function(){ buscarRemoto(true); });
}
function leerArchivo(e,cb){
  var f=e.target.files&&e.target.files[0];
  if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){ cb(String(fr.result||"")); };
  fr.onerror=function(){ alert("No se pudo leer el archivo."); };
  fr.readAsText(f,"utf-8");
}

/* ------------------------------ datos publicados ------------------------------ */
/* El tablero busca datos.json en su misma carpeta cada vez que se abre.
   Si no hay conexión, usa la última copia guardada en el navegador. */

function sello(ds){ return ds&&ds.meta?(ds.meta.actualizado||ds.meta.generado||""):""; }

function buscarRemoto(manual){
  if(!window.fetch||location.protocol==="file:"){
    if(manual) alert("Este archivo se está abriendo desde el dispositivo, no desde el sitio web. Usa el enlace del tablero para recibir actualizaciones.");
    return;
  }
  E.red="buscando datos…";
  if(manual) render();
  fetch("datos.json?t="+Date.now(),{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.text();
  }).then(function(t){
    var j=JSON.parse(t);
    if(!j||j.v!==1||!Array.isArray(j.regs)) throw new Error("formato");
    var mismo=E.ds && sello(j)===sello(E.ds) && j.regs.length===E.ds.regs.length;
    if(mismo){
      E.red="al día";
      if(manual) alert("Ya tienes los datos más recientes: hasta el "+dmy(parseFecha(j.meta.fechaMax))+".");
      render();
      return;
    }
    almacen.set(STORE_KEY,t);
    var vista={ sesion:E.sesion, periodo:E.periodo, verComo:E.verComo };
    setDs(j);
    E.sesion=vista.sesion; E.periodo=vista.periodo; E.verComo=vista.verComo;
    E.red="actualizado "+new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});
    render();
    if(manual) alert("Datos actualizados: hasta el "+dmy(parseFecha(j.meta.fechaMax))+".");
  }).catch(function(){
    E.red=E.ds?"sin conexión, mostrando la última copia":"sin conexión y sin datos guardados";
    render();
    if(manual) alert("No se pudo conectar. Revisa el wifi o los datos de la tablet.");
  });
}

/* ------------------------------ arranque ------------------------------ */

(function(){
  var incrustado=(document.getElementById("datos").textContent||"").trim();
  var crudo=incrustado||almacen.get(STORE_KEY);
  if(crudo){
    try{ setDs(JSON.parse(crudo)); }catch(e){ E.ds=null; E.idx=null; }
  }
  render();
  buscarRemoto(false);
})();
</script>
