<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rendimientos de cosecha · Flores El Trigal</title>
<style>
:root{
  /* Paleta Flores El Trigal: azul #1F3361, amarillo #FFD40A, gris #6B6D6D */
  --bg:#F1F3F7; --surface:#FFFFFF; --ink:#151C2E; --muted:#6B6D6D; --line:#D9DDE6;
  --deep:#1F3361; --deep2:#3A548F; --accent:#FFD40A; --accent-txt:#8A6B00;
  --alto:#1B7A4B; --bajo:#C0451B; --medio:#6B6D6D;
  --sombra:0 1px 0 rgba(31,51,97,.04), 0 8px 24px -18px rgba(31,51,97,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3,p,ol,ul,table{margin:0}
.num,.kpival,.cintaval{font-variant-numeric:tabular-nums}
.pantalla{padding:14px 16px 44px;max-width:1180px;margin:0 auto}
.cab{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--deep);color:#EDF0F7;border-radius:12px;margin-bottom:14px;border-bottom:3px solid var(--accent)}
.cabizq{display:flex;gap:10px;align-items:center;min-width:0}
.cabmarca{display:inline-flex;background:rgba(255,255,255,.1);padding:6px;border-radius:9px}
.cabtit{font-size:17px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
.cabsub{font-size:12px;opacity:.8;margin-top:2px}
.cabbtns{display:flex;gap:8px;flex-shrink:0}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 100% at 50% 0%, #F7F9FD 0%, var(--bg) 55%, #DCE1EC 100%)}
.loginbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:420px;box-shadow:var(--sombra)}
.marca{display:flex;gap:10px;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.marcaesq{display:inline-flex;background:var(--deep);padding:7px;border-radius:10px}
.marcatit{font-size:18px;font-weight:680;letter-spacing:-.015em}
.marcasub{font-size:12px;color:var(--muted)}
.loginpie{margin-top:14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.versionpie{margin-top:6px;font-size:10.5px;color:#B7BDC9;text-align:center}
.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:12px 0 5px}
.lblmini{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit;color:var(--ink)}
.inp-mini{width:auto;min-width:112px;padding:7px 9px;font-size:13px}
.inp:focus-visible,.btn:focus-visible,.chip:focus-visible,.area:focus-visible,.cintafila:focus-visible,.podiofila:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;border-radius:9px;padding:10px 14px;cursor:pointer;border:1px solid transparent}
.btn-pri{background:var(--deep);color:#fff;width:100%;margin-top:16px}
.btn-sec{background:#fff;border-color:var(--line);color:var(--deep);padding:8px 12px;font-size:13px}
.btn-mini{background:#F0F3F9;border-color:var(--line);color:var(--deep);padding:5px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.botonera{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.botonera .btn-pri{width:auto;margin-top:0}
.err{margin-top:12px;font-size:13px;color:#8E2B2B;background:#FBEDED;border:1px solid #F0D2D2;padding:9px 11px;border-radius:9px}
.ok{margin-top:12px;font-size:13px;color:#15563B;background:#EAF4EE;border:1px solid #CBE3D6;padding:9px 11px;border-radius:9px}
.barrafiltros{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.grupo{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.grupo-wrap{flex-wrap:wrap;overflow:visible}
.chip{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted);white-space:nowrap}
.chip-on{background:var(--deep);border-color:var(--deep);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px 11px;box-shadow:var(--sombra)}
.kpi-fuerte{border-color:#C3CDE0;background:linear-gradient(180deg,#FFFFFF 0%,#F7F9FD 100%)}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}
.kpival{font-size:34px;font-weight:660;letter-spacing:-.03em;line-height:1.05;margin-top:6px;border-bottom:3px solid var(--accent);display:inline-block;padding-bottom:2px}
.kpiun{font-size:12px;font-weight:600;letter-spacing:0;color:var(--muted);margin-left:5px}
.kpipie{font-size:12px;color:var(--muted);margin-top:7px}
.tarj{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:var(--sombra)}
.tarjtit{font-size:14px;font-weight:660;letter-spacing:-.01em;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.tarjsub{font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.rejilla2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.svgchart{width:100%;height:auto;display:block;max-height:320px}
.svgval{font-size:15px;fill:var(--ink);font-weight:600}
.svgtick{font-size:14px;fill:var(--muted)}
.svgtick2{font-size:12px;fill:var(--muted);opacity:.85}
.svgnote{font-size:14px;font-weight:650}
.cinta{display:flex;flex-direction:column;gap:3px}
.cintafila{display:grid;grid-template-columns:minmax(120px,1.1fr) 3fr 62px 82px 62px;gap:10px;align-items:center;background:none;border:0;border-radius:7px;padding:6px;cursor:pointer;text-align:left;font:inherit;width:100%;color:inherit}
.cintafila:hover{background:#F3F5FB}
.cintanom{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cintapista{position:relative;height:15px;background:#E8EBF2;border-radius:4px;overflow:hidden}
.cintapista.cintasinhoras{display:flex;align-items:center;padding-left:8px;font-size:11.5px;color:var(--bajo);font-weight:600;background:#FDF1E9}
.cintabarra{position:absolute;top:0;bottom:0;left:0;border-radius:4px}
.cintabarra.t-alto{background:var(--deep2)}
.cintabarra.t-medio{background:#8D9AB5}
.cintabarra.t-bajo{background:#D9A78C}
.cintaprom{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--accent);border-radius:2px;box-shadow:0 0 0 1px rgba(138,107,0,.35)}
.cintaval{font-size:14px;font-weight:700;text-align:right}
.cintadif{font-size:12px;text-align:right}
.podio{list-style:none;padding:0;display:flex;flex-direction:column;gap:4px}
.podiofila{display:grid;grid-template-columns:22px 1fr auto 78px;gap:10px;align-items:center;width:100%;background:#F5F7FC;border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;font:inherit;text-align:left;color:inherit}
.podio-bajo .podiofila{background:#FDF6EC;border-color:#EEDCC2}
.podiopos{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.podionom{font-size:13.5px;font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podioval{font-size:15px;font-weight:680}
.podioval em{font-size:10.5px;font-style:normal;font-weight:500;color:var(--muted);margin-left:3px}
.podiodif{font-size:12.5px;text-align:right;font-weight:600}
.detcab{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.detnomtit{font-size:20px;font-weight:680;letter-spacing:-.02em}
.detnomsub{font-size:12px;color:var(--muted)}
.fichas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.ficha{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.fichat{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650}
.fichav{font-size:15px;font-weight:620;margin-top:3px}
.tablabox{overflow-x:auto}
.tabla{width:100%;border-collapse:collapse;font-size:13px}
.tabla th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tabla td{padding:8px;border-bottom:1px solid #EEF2ED;vertical-align:top}
.tabla .num{text-align:right}
.tabla .fuerte{font-weight:680}
.tabla .mini{font-size:11.5px;color:var(--muted)}
.tag{display:inline-block;margin-left:7px;font-size:10px;background:#FFF6CC;color:var(--accent-txt);border:1px solid #EFDC97;border-radius:999px;padding:1px 7px}
.area{width:100%;min-height:170px;resize:vertical;padding:11px;border:1px solid var(--line);border-radius:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#FCFCFE;color:var(--ink)}
.cargas{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.cargaarchivo{background:#F5F7FC;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:7px}
.nota{font-size:12px;color:var(--muted)}
.previo{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.lista{padding-left:18px;font-size:13px}
.lista li{margin-bottom:5px}
.vacio{font-size:13px;color:var(--muted);background:#F5F7FC;border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center}
.t-alto{color:var(--alto)}.t-bajo{color:var(--bajo)}.t-medio{color:var(--medio)}
/* pestañas Rendimiento / Calidad */
.avisoapoyos{font-size:12.5px;color:var(--muted);background:#F5F7FC;border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:12px}
.link-persona{background:none;border:0;padding:0;font:inherit;color:var(--deep);cursor:pointer;text-decoration:underline;text-align:left}
.boni-volver{margin-top:14px;text-align:center}
.pestanas{display:flex;gap:0;margin-bottom:14px;background:#E7EAF2;border-radius:11px;padding:4px}
.pest{flex:1;font:inherit;font-size:15px;font-weight:700;padding:11px 8px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer}
.pest-on{background:var(--deep);color:#fff;box-shadow:0 1px 3px rgba(31,51,97,.3)}
.tarj-tenue{background:#FAFBFD}
.inp-per{min-width:150px}
.sinreg{margin-top:12px;font-size:12.5px;color:var(--muted);background:#F5F7FC;border:1px dashed var(--line);border-radius:9px;padding:9px 11px;line-height:1.5}
.sinreg b{color:var(--ink)}
.sinreg.dormidos{background:#FDF6EC;border-color:#EEDCC2;border-style:solid}
.sinreg.aviso{background:#FDF1E9;border-color:#EFD8C6;border-style:solid;color:#8A3C10}
.sinreg.aviso b{color:#8A3C10}

/* barra de metas y KPI doble */
.metasbarra{font-size:12.5px;color:var(--muted);margin:-4px 0 10px;padding:7px 11px;background:#FFF9DB;border:1px solid #F0DC96;border-radius:9px}
.metasbarra b{color:var(--ink)}
.kpicalfila{display:flex;align-items:center;gap:7px;margin-top:9px}
.kpicallbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650}
.chipcal{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
.chipcal.c-ok{background:#EAF4EE;color:#15563B;border:1px solid #CBE3D6}
.chipcal.c-no{background:#FDF1E9;color:#8A3C10;border:1px solid #EFD8C6}
.chipcal.c-nulo{background:#F1F3F7;color:var(--muted);border:1px solid var(--line);font-weight:600}

/* grupos de cumplimiento */
.grupos{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-bottom:12px}
.gchip{font:inherit;cursor:pointer;text-align:left;background:#F5F7FC;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink)}
.gchip b{display:block;font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.gchip span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.2}
.gchip-on{border-color:var(--deep);border-width:2px;background:#fff;box-shadow:var(--sombra)}
.gchip.g-ambas b{color:var(--alto)}
.gchip.g-ninguna b{color:var(--bajo)}
.gchip.g-solo_r b,.gchip.g-solo_c b{color:var(--accent-txt)}
.ordenbar{margin-bottom:10px}

/* cabecera y columnas de la cinta */
.cintacab{display:grid;grid-template-columns:minmax(120px,1.1fr) 3fr 62px 82px 62px;gap:10px;padding:0 6px 6px;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650;border-bottom:1px solid var(--line);margin-bottom:4px}
.cintacab .der{text-align:right}
.cintacal{text-align:right}
.podiocal{text-align:right}

/* semáforos de meta en los KPI */
.kpi-ok .kpival{border-bottom-color:var(--alto)}
.kpi-no .kpival{border-bottom-color:var(--bajo)}
.metas{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.metas .inp-mini{min-width:78px}
.inp-pin{min-width:84px;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.06em}
.btn-mostrar{width:auto;margin-top:0}

/* pantalla para mostrar a la persona */
.show{max-width:820px;margin:0 auto;padding:18px 16px 40px;position:relative}
.show-cerrar{position:absolute;top:14px;right:14px}
.shownom{font-size:clamp(24px,5vw,34px);font-weight:700;letter-spacing:-.02em;line-height:1.1;padding-right:96px}
.showfecha{font-size:14px;color:var(--muted);margin-top:4px;margin-bottom:18px}
.showfiltros{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.showfiltros .inp-mini{min-width:140px}
.showcajas{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.showcaja{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px 14px}
.showcaja.s-ok{border-color:#9AC9B1;background:linear-gradient(180deg,#FFFFFF,#F0F9F4)}
.showcaja.s-no{border-color:#E6BFA6;background:linear-gradient(180deg,#FFFFFF,#FDF4EE)}
.showeye{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.showval{font-size:clamp(38px,9vw,56px);font-weight:700;letter-spacing:-.035em;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
.showun{font-size:15px;font-weight:600;color:var(--muted);margin-left:6px;letter-spacing:0}
.showmeta{font-size:13px;color:var(--muted);margin-top:8px;font-weight:600}
.showpie{font-size:14px;margin-top:2px;font-weight:600}
.showcaja.s-ok .showpie{color:var(--alto)}
.showcaja.s-no .showpie{color:var(--bajo)}
.showcomp{margin-top:14px;padding:14px;border-radius:12px;font-size:clamp(15px,3.4vw,19px);font-weight:600;line-height:1.35}
.showcomp.s-ok{background:#EAF4EE;border:1px solid #CBE3D6;color:#14563C}
.showcomp.s-no{background:#FDF1E9;border:1px solid #EFD8C6;color:#8A3C10}
.showcomp.s-neutro{background:#F4F7F3;border:1px solid var(--line);color:var(--ink)}
.showchart{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.showcalidad{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.showpuntos{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.showpunto{flex:1 1 74px;border-radius:10px;padding:8px 6px;text-align:center;border:1px solid var(--line)}
.showpunto.s-ok{background:#EAF4EE;border-color:#CBE3D6}
.showpunto.s-no{background:#FDF1E9;border-color:#EFD8C6}
.showpunto.s-neutro{background:#F5F7FC}
.showpdia{display:block;font-size:11px;color:var(--muted);font-weight:600}
.showpval{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}

@media (max-width:900px){
  .cargas{grid-template-columns:1fr}
  .kpival{font-size:29px}
  .cintafila,.cintacab{grid-template-columns:minmax(88px,1fr) 1.6fr 54px 70px;gap:7px}
  .cintafila .cintadif,.cintacab span:last-child{display:none}
  .grupos{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
  .pantalla{padding:10px 11px 34px}
}
</style>
</head>
<body>
<div id="root"></div>

<!-- Base de datos del tablero. El panel de administración la reescribe al exportar. -->
<script id="datos" type="application/json"></script>

<script>
"use strict";
/* =========================================================================
   Tablero de rendimientos de cosecha · Flores El Trigal
   Archivo único, sin dependencias externas. Funciona sin internet.
   ========================================================================= */

var LIDERES_ACTUALES = [
  "ARISTIZABAL GARCIA JOHN FABER",
  "MEDINA CERVERA MARIA ETELVINA",
  "GUTIERREZ JURADO EVELIN ELIANA",
  "TAPIAS BELTRAN NELSON DAVID",
  "VARELA MORALES NAYBELIN WURALDINE",
  "MARULANDA ROJAS LUZ MARY"
];
var PINES = {
  "ARISTIZABAL GARCIA JOHN FABER": "1001",
  "MEDINA CERVERA MARIA ETELVINA": "1002",
  "GUTIERREZ JURADO EVELIN ELIANA": "1003",
  "TAPIAS BELTRAN NELSON DAVID": "1004",
  "VARELA MORALES NAYBELIN WURALDINE": "1005",
  "MARULANDA ROJAS LUZ MARY": "1006",
  "__ADMIN__": "2026"
};
var LABOR_COSECHA = "COSECHA"; // se muestra toda labor que contenga esta palabra
var VERSION_TABLERO = "2026-08-27 22:15"; // se cambia cada vez que se genera el archivo, para detectar caché vieja
var META_REND_DEF = 1600;   // esquejes por hora
var META_CAL_DEF = 0.92;    // conformidad
var DIAS_DORMIDO_DEF = 28;  // sin cosechar: se muestra aparte
var COLS = ["CODIGO","NOMBRE DEL COLABORADOR","SEMANA","TIPO REND","ESQUEJES COSECHADOS","HORAS COSECHADAS","CONFORMIDAD","LIDER 0","EXPERIENCIA","ACTIVO","LABOR","FECHA DE INGRESO PERSONA","FECHA DE INGRESO ESQUEJE"];
var MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var DIA_NOMBRE = ["dom","lun","mar","mié","jue","vie","sáb"];
var DIA_MS = 86400000;
var STORE_KEY = "trigal_rend_v1";

/* ------------------------------ utilidades ------------------------------ */

/* Los usuarios viven dentro de datos.json. Si el archivo aún no los trae,
   se usan los seis líderes y PIN de fábrica. */
function listaUsuarios(){
  var u=(E.ds&&E.ds.meta&&Array.isArray(E.ds.meta.usuarios))?E.ds.meta.usuarios:null;
  if(u&&u.length) return u;
  return LIDERES_ACTUALES.map(function(l){ return { lider:l, pin:PINES[l] }; });
}
function pinAdmin(){
  var p=(E.ds&&E.ds.meta)?E.ds.meta.pinAdmin:null;
  return p?String(p):PINES.__ADMIN__;
}
function tieneUsuario(lider){
  return listaUsuarios().some(function(u){ return u.lider===lider; });
}
function pinLibre(){
  var usados=listaUsuarios().map(function(u){ return +u.pin; });
  var n=1001;
  while(usados.indexOf(n)>=0||String(n)===pinAdmin()) n++;
  return String(n);
}
function asegurarUsuarios(){
  if(!E.ds.meta.usuarios||!E.ds.meta.usuarios.length){
    E.ds.meta.usuarios=listaUsuarios().map(function(u){ return { lider:u.lider, pin:String(u.pin) }; });
  }
  if(!E.ds.meta.pinAdmin) E.ds.meta.pinAdmin=PINES.__ADMIN__;
}

function metaRend(){ var m=E.ds&&E.ds.meta?E.ds.meta.metaRend:null; return (m&&m>0)?m:META_REND_DEF; }
function diasDormido(){
  var d=(E.ds&&E.ds.meta)?E.ds.meta.diasDormido:null;
  return (d&&d>0)?d:DIAS_DORMIDO_DEF;
}
function metaCal(){ var m=E.ds&&E.ds.meta?E.ds.meta.metaCal:null; return (m&&m>0)?m:META_CAL_DEF; }
function cumple(v,meta){ return v==null?null:(v>=meta); }
function claseMeta(v,meta){ var c=cumple(v,meta); return c==null?"":(c?" kpi-ok":" kpi-no"); }

function norm(s){
  return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim().toUpperCase();
}
function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function numOrNull(v){
  if(v==null) return null;
  var s=String(v).trim();
  if(!s) return null;
  var pct=s.indexOf("%")>=0;
  s=s.replace(/%/g,"").replace(/\s/g,"").replace(/\$/g,"");
  if(s.indexOf(",")>=0 && s.indexOf(".")>=0) s=s.replace(/\./g,"").replace(",",".");
  else if(!/^-?0[.,]/.test(s) && /^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  else if(!/^-?0[.,]/.test(s) && /^-?\d{1,3}(,\d{3})+$/.test(s)) s=s.replace(/,/g,"");
  else if(s.indexOf(",")>=0) s=s.replace(",",".");
  var n=Number(s);
  if(!isFinite(n)) return null;
  return pct? n/100 : n;
}
function parseFecha(v){
  if(v==null) return null;
  if(v instanceof Date && !isNaN(v)) return Date.UTC(v.getFullYear(),v.getMonth(),v.getDate());
  var s=String(v).trim();
  if(!s) return null;
  var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return Date.UTC(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ var a=+m[3]; if(a<100) a+= a<70?2000:1900; return Date.UTC(a,+m[2]-1,+m[1]); }
  if(/^\d+([.,]\d+)?$/.test(s)){
    var serie=numOrNull(s);
    if(serie!=null && serie>20000 && serie<80000) return Date.UTC(1899,11,30)+Math.round(serie)*DIA_MS;
  }
  return null;
}
function p2(n){ return String(n).padStart(2,"0"); }
function ymd(ms){ var d=new Date(ms); return d.getUTCFullYear()+"-"+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate()); }
function dmy(ms){ if(ms==null) return "—"; var d=new Date(ms); return p2(d.getUTCDate())+"/"+p2(d.getUTCMonth()+1)+"/"+d.getUTCFullYear(); }
function dm(ms){ var d=new Date(ms); return d.getUTCDate()+"/"+(d.getUTCMonth()+1); }
var nfInt=new Intl.NumberFormat("es-CO",{maximumFractionDigits:0});
var nf1=new Intl.NumberFormat("es-CO",{minimumFractionDigits:1,maximumFractionDigits:1});
function fInt(n){ return (n==null||!isFinite(n))?"—":nfInt.format(Math.round(n)); }
function f1(n){ return (n==null||!isFinite(n))?"—":nf1.format(n); }
function fPct(n){ return (n==null||!isFinite(n))?"—":nf1.format(n*100)+"%"; }
function corto(nombre){
  var p=String(nombre).split(" ").filter(Boolean);
  if(p.length<=3) return p.join(" ");
  return p[0]+" "+p[1]+" "+p[2]; // dos apellidos y el primer nombre
}
function difTxt(d){ return d==null?"—":((d>=0?"+":"")+nf1.format(d*100)+"%"); }
function tonoDif(d){ return d==null?"medio":(d>=0.05?"alto":(d>=-0.05?"medio":"bajo")); }

/* ------------------------------ almacenamiento ------------------------------ */

var memoria={};
var almacen={
  modo:"memoria",
  get:function(k){
    try{ if(window.localStorage){ almacen.modo="memoria del navegador"; return window.localStorage.getItem(k); } }catch(e){}
    almacen.modo="solo esta sesión";
    return memoria[k]!=null?memoria[k]:null;
  },
  set:function(k,v){
    try{ if(window.localStorage){ window.localStorage.setItem(k,v); almacen.modo="memoria del navegador"; memoria[k]=v; return true; } }catch(e){}
    memoria[k]=v; almacen.modo="solo esta sesión"; return false;
  }
};

/* ------------------------------ modelo de datos ------------------------------ */

function construirDesdeFilas(filas){
  var lidSet=[], labSet=[];
  function idxDe(arr,v){ if(v==null||v==="") return -1; var i=arr.indexOf(v); if(i<0){ arr.push(v); i=arr.length-1; } return i; }
  filas.sort(function(a,b){ return (a.fechaMs-b.fechaMs)||(a.cod-b.cod); });
  var base=filas.length?filas[0].fechaMs:Date.UTC(2026,0,1);
  var porCod=new Map(), regs=[];
  for(var i=0;i<filas.length;i++){
    var f=filas[i];
    if(!porCod.has(f.cod)) porCod.set(f.cod,{idx:porCod.size,ultima:null});
    var p=porCod.get(f.cod);
    p.ultima=f;
    regs.push([p.idx, Math.round((f.fechaMs-base)/DIA_MS), f.sem, f.dia, f.esq,
      Math.round((f.hor||0)*100), f.cf==null?null:Math.round(f.cf*1000), idxDe(lidSet,f.lid)]);
  }
  var personas=[];
  porCod.forEach(function(p,cod){
    var u=p.ultima;
    personas[p.idx]=[cod, u.nom, u.ingreso?ymd(u.ingreso):null,
      /LABORANDO|^SI$|ACTIVO/.test(norm(u.act))?1:0, u.exp||"SIN REGISTRO", idxDe(labSet,u.lab), idxDe(lidSet,u.lid)];
  });
  var maxD=0;
  for(var k=0;k<regs.length;k++) if(regs[k][1]>maxD) maxD=regs[k][1];
  return {
    v:1,
    meta:{ base:ymd(base), generado:new Date().toISOString(), registros:regs.length, personas:personas.length,
      fechaMin:ymd(base), fechaMax:ymd(base+maxD*DIA_MS) },
    lideres:lidSet, labores:labSet, personas:personas, regs:regs
  };
}

function expandir(ds){
  var base=parseFecha(ds.meta.base);
  return ds.regs.map(function(a){
    var p=ds.personas[a[0]];
    return { cod:p[0], nom:p[1], sem:a[2], dia:a[3], esq:a[4], hor:(a[5]||0)/100,
      cf:a[6]==null?null:a[6]/1000, lid:ds.lideres[a[7]]||"SIN LÍDER", exp:p[4],
      act:p[3]?"LABORANDO":"RETIRADO", lab:ds.labores[p[5]]||"SIN REGISTRO",
      ingreso:p[2]?parseFecha(p[2]):null, fechaMs:base+a[1]*DIA_MS };
  });
}

function fusionar(dsBase,dsNuevo){
  var mapa=new Map(), nuevos=0, reemplazados=0;
  expandir(dsBase).forEach(function(f){ mapa.set(f.cod+"|"+f.fechaMs,f); });
  expandir(dsNuevo).forEach(function(f){
    var k=f.cod+"|"+f.fechaMs;
    if(mapa.has(k)) reemplazados++; else nuevos++;
    mapa.set(k,f);
  });
  return { ds:construirDesdeFilas(Array.from(mapa.values())), nuevos:nuevos, reemplazados:reemplazados };
}

/* Metas, usuarios y ajustes no viven en las filas del Excel: hay que
   trasladarlos a mano cada vez que se reconstruye la base. */
var CLAVES_CONFIG=["metaRend","metaCal","diasDormido","usuarios","pinAdmin"];
function heredarConfig(dsNuevo,dsViejo){
  if(!dsNuevo||!dsNuevo.meta) return dsNuevo;
  var vieja=(dsViejo&&dsViejo.meta)?dsViejo.meta:{};
  CLAVES_CONFIG.forEach(function(k){
    if(dsNuevo.meta[k]==null&&vieja[k]!=null) dsNuevo.meta[k]=vieja[k];
  });
  return dsNuevo;
}

function indexar(ds){
  if(!ds||!ds.regs) return null;
  var baseMs=parseFecha(ds.meta.base);
  var personas=ds.personas.map(function(p,i){
    return { i:i, cod:p[0], nom:p[1], ingreso:p[2]?parseFecha(p[2]):null, activo:!!p[3], exp:p[4],
      labor:ds.labores[p[5]]||"SIN REGISTRO", lider:ds.lideres[p[6]]||"SIN LÍDER", semUlt:null,
      cosecha: norm(ds.labores[p[5]]||"").indexOf(LABOR_COSECHA)>=0 };
  });
  var regs=new Array(ds.regs.length), dias=new Set(), semanas=new Set();
  for(var k=0;k<ds.regs.length;k++){
    var a=ds.regs[k], hor=(a[5]||0)/100, ms=baseMs+a[1]*DIA_MS, f=new Date(ms);
    regs[k]={ p:a[0], d:a[1], ms:ms, anio:f.getUTCFullYear(), mes:f.getUTCMonth(), sem:a[2],
      ciclo:Math.floor(a[2]/100), dia:a[3], esq:a[4], hor:hor, cf:a[6]==null?null:a[6]/1000,
      lider:ds.lideres[a[7]]||"SIN LÍDER", r:hor>0?a[4]/hor:null,
      boni:a.length>8?a[8]:0 };
    /* Calidad: vacío, cero o negativo significa que ese día no se revisó.
       Se deja en null para que no entre en ningún promedio. */
    if(regs[k].cf!=null&&regs[k].cf<=0) regs[k].cf=null;
    dias.add(a[1]); semanas.add(a[2]);
  }
  var porPersona=new Map();
  regs.forEach(function(r){ if(!porPersona.has(r.p)) porPersona.set(r.p,[]); porPersona.get(r.p).push(r); });
  porPersona.forEach(function(arr){ arr.sort(function(a,b){ return a.d-b.d; }); });

  /* Líder actual = el de la SEMANA de cosecha más reciente; si en esa semana hubo
     más de un líder, gana el del último día. El histórico se conserva completo. */
  personas.forEach(function(per){
    var h=porPersona.get(per.i);
    if(!h||!h.length) return;
    var semMax=-Infinity, ult=null, i;
    for(i=0;i<h.length;i++) if(h[i].sem>semMax) semMax=h[i].sem;
    for(i=0;i<h.length;i++) if(h[i].sem===semMax && (!ult||h[i].d>=ult.d)) ult=h[i];
    per.semUlt=semMax;
    per.dUlt=ult?ult.d:null;
    if(ult) per.lider=ult.lider;
  });

  var equipos=new Map();
  personas.forEach(function(per){
    if(!equipos.has(per.lider)) equipos.set(per.lider,[]);
    equipos.get(per.lider).push(per);
  });
  equipos.forEach(function(arr){ arr.sort(function(a,b){ return a.nom.localeCompare(b.nom,"es"); }); });

  return {
    meta:ds.meta, baseMs:baseMs, personas:personas, regs:regs, porPersona:porPersona, equipos:equipos,
    diasOrd:Array.from(dias).sort(function(a,b){ return b-a; }),
    semOrd:Array.from(semanas).sort(function(a,b){ return b-a; }),
    lideres:Array.from(equipos.keys()).sort(function(a,b){ return a.localeCompare(b,"es"); }),
    msDe:function(d){ return baseMs+d*DIA_MS; }
  };
}

/* Todo registro con esquejes cuenta en el total, tenga o no horas: si faltan
   horas, esos esquejes suben el rendimiento del período en vez de perderse,
   que es justamente la señal de que hay que corregir la digitación.
   Si hay horas y cero esquejes, sí bajan el rendimiento: puede ser un día
   real sin cosecha o esquejes sin digitar, y también debe verse. */
function agrega(lista){
  var esq=0,hor=0,cfs=0,ncf=0,n=0;
  /* Bonificación: un valor por semana por persona. Sumamos el valor único de
     cada semana (no multiplicamos por los días de la semana). */
  var boniSems=new Map(), boniTotal=0;
  for(var i=0;i<lista.length;i++){
    var r=lista[i];
    if(r.esq<=0&&!(r.hor>0)) continue;
    esq+=r.esq; hor+=r.hor; n++;
    if(r.cf!=null&&r.cf>0){ cfs+=r.cf; ncf++; }
    if(r.boni>0&&!boniSems.has(r.sem)){ boniSems.set(r.sem,r.boni); boniTotal+=r.boni; }
  }
  return { n:n, esq:esq, hor:hor, r:hor>0?esq/hor:null, cf:ncf?cfs/ncf:null,
           boni:boniTotal, nBoniSems:boniSems.size };
}
function filtroPeriodo(periodo,ref){
  if(periodo==="dia") return function(r){ return r.d===ref.d; };
  if(periodo==="semana") return function(r){ return r.sem===ref.sem; };
  if(periodo==="mes") return function(r){ return r.anio===ref.anio && r.mes===ref.mes; };
  return function(r){ return r.ciclo===ref.ciclo; };
}

/* Variante simple: claves disponibles de un período dentro de una lista de
   registros, un filtro por esa clave, y su etiqueta para mostrar. Se usa
   en la pestaña general del panel, donde no hay una sola persona de fondo. */
function clavesDe(regs,per){
  var f=(per==="dia")?function(r){ return r.d; }
    :(per==="semana")?function(r){ return r.sem; }
    :(per==="mes")?function(r){ return r.anio*12+r.mes; }
    :function(r){ return r.ciclo; };
  return Array.from(new Set(regs.map(f))).sort(function(a,b){ return b-a; });
}
function filtroClave(per,clave){
  if(per==="dia") return function(r){ return r.d===clave; };
  if(per==="semana") return function(r){ return r.sem===clave; };
  if(per==="mes") return function(r){ return r.anio*12+r.mes===clave; };
  return function(r){ return r.ciclo===clave; };
}
function etiquetaPeriodo(per,c){
  if(per==="dia") return dmy(E.idx.msDe(c));
  if(per==="semana") return "Semana "+c;
  if(per==="mes") return MESES[c%12]+" "+Math.floor(c/12);
  return "Ciclo 20"+c;
}

/* ------------------------------ lectura de texto pegado ------------------------------ */

function detectarSeparador(linea){
  var cand=["\t",";","|",","], mejor="\t", max=0;
  cand.forEach(function(c){ var n=linea.split(c).length; if(n>max){ max=n; mejor=c; } });
  return mejor;
}
function mapaColumnas(cabecera){
  var alias={
    CODIGO:["CODIGO","COD","CEDULA","IDENTIFICACION"],
    NOMBRE:["NOMBRE DEL COLABORADOR","NOMBRE","COLABORADOR"],
    SEMANA:["SEMANA"], TIPO:["TIPO REND","TIPO","DIA"],
    ESQ:["ESQUEJES COSECHADOS","ESQUEJES"], HOR:["HORAS COSECHADAS","HORAS"],
    CONF:["CONFORMIDAD","CALIDAD"], LIDER:["LIDER 0","LIDER"], EXP:["EXPERIENCIA"],
    ACT:["ACTIVO","LABORANDO/RETIRADOS","ESTADO"], LAB:["LABOR"],
    FIP:["FECHA DE INGRESO PERSONA","FECHA INGRESO PERSONA","FECHA DE INGRESO"],
    FIE:["FECHA DE INGRESO ESQUEJE","FECHA INGRESO ESQUEJE","FECHA ESQUEJE","FECHA"]
  };
  var cab=cabecera.map(norm), m={};
  Object.keys(alias).forEach(function(clave){
    m[clave]=-1;
    for(var j=0;j<alias[clave].length;j++){
      var i=cab.indexOf(norm(alias[clave][j]));
      if(i>=0){ m[clave]=i; break; }
    }
  });
  return m;
}
function parsearTexto(texto){
  var t=String(texto||"").trim();
  if(!t) return { error:"No hay datos para procesar." };
  if(t.charAt(0)==="{"){
    try{
      var j=JSON.parse(t);
      if(j && j.v===1 && Array.isArray(j.regs) && Array.isArray(j.personas))
        return { ds:j, errores:[], filas:j.regs.length, fuente:"archivo JSON" };
      return { error:"El JSON no tiene el formato esperado." };
    }catch(e){ return { error:"El JSON está mal formado." }; }
  }
  var lineas=t.split(/\r?\n/).filter(function(l){ return l.trim()!==""; });
  if(!lineas.length) return { error:"No hay filas." };
  var sep=detectarSeparador(lineas[0]);
  var primera=lineas[0].split(sep);
  var conCabecera=norm(primera.join(" ")).indexOf("ESQUEJES")>=0 || norm(primera[0])==="CODIGO";
  var pos={CODIGO:0,NOMBRE:1,SEMANA:2,TIPO:3,ESQ:4,HOR:5,CONF:6,LIDER:7,EXP:8,ACT:9,LAB:10,FIP:11,FIE:12};
  var map=conCabecera?mapaColumnas(primera):pos;
  if(map.CODIGO<0||map.ESQ<0||map.HOR<0||map.FIE<0)
    return { error:"Faltan columnas obligatorias: CODIGO, ESQUEJES COSECHADOS, HORAS COSECHADAS y FECHA DE INGRESO ESQUEJE." };

  var filas=[], errores=[], inicio=conCabecera?1:0;
  for(var i=inicio;i<lineas.length;i++){
    var c=lineas[i].split(sep), nro=i+1;
    var cod=numOrNull(c[map.CODIGO]), fechaMs=parseFecha(c[map.FIE]);
    var e=numOrNull(c[map.ESQ]), hor=numOrNull(c[map.HOR]);
    if(cod==null){ errores.push({nro:nro,motivo:"CODIGO vacío o no numérico",txt:lineas[i].slice(0,70)}); continue; }
    if(fechaMs==null){ errores.push({nro:nro,motivo:"FECHA DE INGRESO ESQUEJE inválida",txt:lineas[i].slice(0,70)}); continue; }
    if(e==null){ errores.push({nro:nro,motivo:"ESQUEJES COSECHADOS inválido",txt:lineas[i].slice(0,70)}); continue; }
    var cf=map.CONF>=0?numOrNull(c[map.CONF]):null;
    if(cf!=null && cf>1.5) cf=cf/100;
    var tipo=map.TIPO>=0?String(c[map.TIPO]||""):"";
    var diaN=numOrNull(tipo.replace(/[^0-9]/g,""))||0;
    filas.push({
      cod:Math.round(cod),
      nom:String(c[map.NOMBRE]!=null?c[map.NOMBRE]:"").trim()||("CÓDIGO "+Math.round(cod)),
      sem:map.SEMANA>=0?Math.round(numOrNull(c[map.SEMANA])||0):0,
      dia:Math.round(diaN), esq:Math.round(e), hor:hor==null?0:hor, cf:cf,
      lid:map.LIDER>=0?(String(c[map.LIDER]||"").trim()||"SIN LÍDER"):"SIN LÍDER",
      exp:map.EXP>=0?String(c[map.EXP]||"").trim():"SIN REGISTRO",
      act:map.ACT>=0?String(c[map.ACT]||"").trim():"LABORANDO",
      lab:map.LAB>=0?String(c[map.LAB]||"").trim():"SIN REGISTRO",
      ingreso:map.FIP>=0?parseFecha(c[map.FIP]):null,
      fechaMs:fechaMs
    });
  }
  if(!filas.length) return { error:"Ninguna fila pasó la validación.", errores:errores };
  filas.forEach(function(f){
    if(!f.sem){
      var d=new Date(f.fechaMs), jue=new Date(f.fechaMs);
      jue.setUTCDate(d.getUTCDate()+3-((d.getUTCDay()+6)%7));
      var ini=Date.UTC(jue.getUTCFullYear(),0,1);
      f.sem=(jue.getUTCFullYear()%100)*100 + (1+Math.round((jue.getTime()-ini)/(7*DIA_MS)));
    }
  });
  return { ds:construirDesdeFilas(filas), errores:errores, filas:filas.length,
    fuente:"texto pegado ("+(sep==="\t"?"tabulaciones":sep)+")" };
}

/* ------------------------------ piezas de interfaz ------------------------------ */

function svgBarras(datos,opc){
  opc=opc||{};
  var w=1000, alto=300, refL=opc.refLinea||0, etiq=opc.etiquetaRef||"prom. equipo";
  var colBarra=opc.color||"var(--deep)";
  var maxV=refL;
  datos.forEach(function(d){ if(d.v&&d.v>maxV) maxV=d.v; });
  maxV=Math.max(1,maxV)*1.14;
  var n=Math.max(1,datos.length), gap=n>20?0.18:0.32, bw=w/(n+gap*(n+1)), base=alto-42;
  function y(v){ return base-((v||0)/maxV)*(base-26); }
  var s='<svg viewBox="0 0 '+w+' '+alto+'" preserveAspectRatio="xMidYMid meet" class="svgchart">';
  s+='<line x1="0" y1="'+base+'" x2="'+w+'" y2="'+base+'" stroke="var(--line)" stroke-width="1.5"/>';
  if(opc.refLinea2){
    s+='<line x1="0" y1="'+y(opc.refLinea2)+'" x2="'+w+'" y2="'+y(opc.refLinea2)+'" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="3 4"/>';
    s+='<text x="'+(w-4)+'" y="'+(y(opc.refLinea2)-6)+'" text-anchor="end" class="svgtick">'+esc(opc.etiquetaRef2||"prom. equipo")+" "+fInt(opc.refLinea2)+'</text>';
  }
  if(refL){
    s+='<line x1="0" y1="'+y(refL)+'" x2="'+w+'" y2="'+y(refL)+'" stroke="var(--accent)" stroke-width="4" stroke-dasharray="10 6"/>';
    s+='<text x="4" y="'+(y(refL)-8)+'" class="svgnote" fill="var(--accent-txt)">'+esc(etiq)+" "+fInt(refL)+'</text>';
  }
  datos.forEach(function(d,i){
    var x=gap*bw+i*(bw+gap*bw), h=Math.max(d.v?2:0, base-y(d.v));
    s+='<rect x="'+x+'" y="'+y(d.v)+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+(d.hl?"var(--accent)":colBarra)+'"'+
      (d.hl?' stroke="var(--deep)" stroke-width="1.5"':'')+' opacity="'+(d.v?0.92:0.14)+'"/>';
    if(n<=16&&d.v) s+='<text x="'+(x+bw/2)+'" y="'+(y(d.v)-7)+'" text-anchor="middle" class="svgval">'+fInt(d.v)+'</text>';
    if(n<=34) s+='<text x="'+(x+bw/2)+'" y="'+(base+17)+'" text-anchor="middle" class="svgtick">'+esc(d.label)+'</text>';
    if(d.sub) s+='<text x="'+(x+bw/2)+'" y="'+(base+32)+'" text-anchor="middle" class="svgtick2">'+esc(d.sub)+'</text>';
  });
  return s+"</svg>";
}

function htmlKpi(eyebrow,valor,unidad,pie,fuerte,semaforo){
  return '<div class="kpi'+(fuerte?" kpi-fuerte":"")+(semaforo||"")+'"><div class="eyebrow">'+esc(eyebrow)+'</div>'+
    '<div class="kpival">'+valor+(unidad?'<span class="kpiun">'+esc(unidad)+'</span>':"")+'</div>'+
    (pie?'<div class="kpipie">'+pie+'</div>':"")+'</div>';
}
function chipCal(cf,meta){
  if(cf==null) return '<span class="chipcal c-nulo">sin dato</span>';
  return '<span class="chipcal '+(cf>=meta?"c-ok":"c-no")+'">'+fPct(cf)+'</span>';
}
function htmlKpiDoble(eyebrow,r,cf,pie,fuerte,esCal){
  var mR=metaRend(), mC=metaCal();
  var grande = esCal
    ? ('<div class="kpival">'+fPct(cf)+'<span class="kpiun">calidad</span></div>'+
       '<div class="kpicalfila"><span class="kpicallbl">Rendimiento</span>'+
       '<span class="chipcal '+(r!=null&&r>=mR?"c-ok":"c-no")+'">'+fInt(r)+' esq/h</span></div>')
    : ('<div class="kpival">'+fInt(r)+'<span class="kpiun">esq/h</span></div>'+
       '<div class="kpicalfila"><span class="kpicallbl">Calidad</span>'+chipCal(cf,mC)+'</div>');
  return '<div class="kpi'+(fuerte?" kpi-fuerte":"")+claseMeta(esCal?cf:r,esCal?mC:mR)+'">'+
    '<div class="eyebrow">'+esc(eyebrow)+'</div>'+grande+
    (pie?'<div class="kpipie">'+pie+'</div>':"")+'</div>';
}

function htmlFicha(t,v,tono){
  return '<div class="ficha"><div class="fichat">'+esc(t)+'</div><div class="fichav'+(tono?" t-"+tono:"")+'">'+v+'</div></div>';
}
/* Una fila por persona con las dos cosas a la vez: barra de rendimiento
   contra la meta y el porcentaje de calidad con su propio semáforo. */
/* Una fila por persona. En modo "rend" la barra es el rendimiento contra la meta
   y la calidad va en pastilla; en modo "cal" es al contrario. */
function htmlCinta(filas,modo){
  var mR=metaRend(), mC=metaCal(), esCal=(modo==="cal");
  var tope;
  if(esCal){ tope=100; }
  else { tope=mR; filas.forEach(function(f){ if(f.v>tope) tope=f.v; }); tope=tope*1.05; }
  var pMeta=Math.max(0,Math.min(100,((esCal?mC*100:mR)/tope)*100));
  var s='<div class="cinta"><div class="cintacab">'+
    '<span>Colaborador</span><span>'+(esCal?"Calidad contra la meta":"Rendimiento contra la meta")+'</span>'+
    '<span class="der">'+(esCal?"Calidad":"esq/h")+'</span>'+
    '<span class="der">'+(esCal?"esq/h":"Calidad")+'</span><span class="der">vs meta</span></div>';
  filas.forEach(function(f){
    if(f.sinHoras){
      s+='<button class="cintafila" data-persona="'+f.k+'">'+
        '<span class="cintanom" title="'+esc(f.nom)+'">'+esc(corto(f.nom))+'</span>'+
        '<span class="cintapista cintasinhoras">'+fInt(f.esq)+' esquejes sin horas registradas</span>'+
        '<span class="cintaval">—</span>'+
        '<span class="cintacal">'+chipCal(f.cf,mC)+'</span>'+
        '<span class="cintadif">falta hora</span></button>';
      return;
    }
    var base=esCal?(f.cf==null?null:f.cf*100):f.v;
    var meta=esCal?mC*100:mR;
    var pct=Math.max(0,Math.min(100,((base||0)/tope)*100));
    var dif=base?(base/meta-1):null, tono=tonoDif(dif);
    s+='<button class="cintafila" data-persona="'+f.k+'">'+
      '<span class="cintanom" title="'+esc(f.nom)+'">'+esc(corto(f.nom))+'</span>'+
      '<span class="cintapista"><span class="cintabarra t-'+tono+'" style="width:'+pct+'%"></span>'+
      '<span class="cintaprom" style="left:'+pMeta+'%"></span></span>'+
      '<span class="cintaval">'+(esCal?fPct(f.cf):fInt(f.v))+'</span>'+
      '<span class="cintacal">'+(esCal
        ? '<span class="chipcal '+(f.v>=mR?"c-ok":"c-no")+'">'+fInt(f.v)+'</span>'
        : chipCal(f.cf,mC))+'</span>'+
      '<span class="cintadif t-'+tono+'">'+difTxt(dif)+'</span></button>';
  });
  return s+"</div>";
}
function htmlPodio(filas,bajo,esCal){
  if(!filas.length) return '<div class="vacio">Sin registros ese día.</div>';
  var mR=metaRend(), mC=metaCal();
  var s='<ol class="podio'+(bajo?" podio-bajo":"")+'">';
  filas.forEach(function(f,i){
    var grande = esCal
      ? ('<span class="podioval '+(f.cf!=null&&f.cf>=mC?"t-alto":"t-bajo")+'">'+fPct(f.cf)+'<em>calidad</em></span>'+
         '<span class="podiocal"><span class="chipcal '+(f.v>=mR?"c-ok":"c-no")+'">'+fInt(f.v)+'</span></span>')
      : ('<span class="podioval '+(f.v>=mR?"t-alto":"t-bajo")+'">'+fInt(f.v)+'<em>esq/h</em></span>'+
         '<span class="podiocal">'+chipCal(f.cf,mC)+'</span>');
    s+='<li><button class="podiofila" data-persona="'+f.k+'">'+
      '<span class="podiopos">'+(i+1)+'</span>'+
      '<span class="podionom">'+esc(corto(f.nom))+'</span>'+grande+'</button></li>';
  });
  return s+"</ol>";
}

var E={ ds:null, idx:null, sesion:null, periodo:"dia", dRef:null, semFiltro:"", personaSel:null,
  pestana:"datos", previo:null, mensaje:null, verComo:"", red:"", mostrar:null,
  vista:"rend", orden:"apellido", cump:"todos", detPeriodo:"dia", detClave:null,
  estadoFiltro:"activos", buscarPersona:"", adminPersonaSel:null, buscarBoni:"", semBoni:null,
  mesFiltro:"", anioFiltro:"", showPeriodo:"dia", showClave:null };

function setDs(ds){
  E.ds=ds;
  E.idx=ds?indexar(ds):null;
  E.dRef=null; E.personaSel=null; E.semFiltro="";
}
function guardar(ds){
  ds.meta.actualizado=new Date().toISOString();
  var texto=JSON.stringify(ds);
  var ok=almacen.set(STORE_KEY,texto);
  setDs(ds);
  return { ok:ok, bytes:texto.length };
}
function descargar(texto,nombre,tipo){
  var b=new Blob([texto],{type:tipo||"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download=nombre;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
}
function exportarTablero(){
  if(!E.ds) return;
  var clon=document.documentElement.cloneNode(true);
  var root=clon.querySelector("#root"); if(root) root.innerHTML="";
  clon.querySelector("#datos").textContent=JSON.stringify(E.ds);
  var nombre="tablero_rendimientos_"+String(E.ds.meta.fechaMax||"").replace(/-/g,"")+".html";
  descargar("<!DOCTYPE html>\n"+clon.outerHTML, nombre, "text/html");
}

function refDe(idx,regs,dRef){
  var enDia=regs.filter(function(r){ return r.d===dRef; });
  var ms=idx.msDe(dRef), f=new Date(ms);
  var sem=enDia.length?enDia[0].sem:0;
  return { d:dRef, ms:ms, sem:sem, anio:f.getUTCFullYear(), mes:f.getUTCMonth(),
    ciclo:sem?Math.floor(sem/100):(f.getUTCFullYear()%100) };
}

function vistaLider(lider,comoAdmin){
  var idx=E.idx;
  if(idx&&E.mostrar!=null) return vistaCosechador(idx.personas[E.mostrar]);
  if(!idx) return '<div class="pantalla">'+htmlCab("Sin datos","Este tablero no trae la base cargada",
    '<button class="btn btn-sec" id="salir">Salir</button>')+
    '<div class="vacio">Pide a Yuber que publique los datos del día.</div></div>';

  var soloApoyos=(lider==="__APOYOS__");
  var esApoyos=soloApoyos||(E.vista==="apoyos");
  var todos=soloApoyos?[]:(idx.equipos.get(lider)||[]);
  var equipo, excluidos=0, laboresApoyo=[];
  if(esApoyos){
    equipo=idx.personas.filter(function(p){ return p.activo&&!p.cosecha; });
    laboresApoyo=Array.from(new Set(equipo.map(function(p){ return p.labor; }))).sort(function(a,b){ return a.localeCompare(b,"es"); });
    if(E.laborFiltro) equipo=equipo.filter(function(p){ return p.labor===E.laborFiltro; });
    equipo=equipo.slice().sort(function(a,b){ return a.nom.localeCompare(b.nom,"es"); });
  } else {
    equipo=todos.filter(function(p){ return p.activo&&p.cosecha; });
    excluidos=todos.filter(function(p){ return p.activo&&!p.cosecha; }).length;
  }

  var regsEquipo=[];
  equipo.forEach(function(p){ var hh=idx.porPersona.get(p.i); if(hh) regsEquipo=regsEquipo.concat(hh); });
  var diasEquipo=Array.from(new Set(regsEquipo.map(function(r){ return r.d; }))).sort(function(a,b){ return b-a; });
  var dRef=E.dRef!=null?E.dRef:(diasEquipo.length?diasEquipo[0]:0);
  var ref0=refDe(idx,regsEquipo,dRef);
  var semActiva=E.semFiltro?+E.semFiltro:ref0.sem;
  var mesesEq=Array.from(new Set(regsEquipo.map(function(r){ return r.anio*12+r.mes; }))).sort(function(a,b){ return b-a; });
  var aniosEq=Array.from(new Set(regsEquipo.map(function(r){ return r.ciclo; }))).sort(function(a,b){ return b-a; });
  var mesActivo=E.mesFiltro!==""?+E.mesFiltro:(ref0.anio*12+ref0.mes);
  var cicloActivo=E.anioFiltro!==""?+E.anioFiltro:ref0.ciclo;
  var ref={ d:dRef, ms:ref0.ms, sem:semActiva, anio:Math.floor(mesActivo/12), mes:mesActivo%12, ciclo:cicloActivo };
  var mR=metaRend(), mC=metaCal();
  var esBoni=(E.vista==="boni"&&!esApoyos);
  var esCal=(E.vista==="cal"&&!esApoyos);

  var botones=(comoAdmin?'<button class="btn btn-sec" id="volveradmin">Volver al panel</button>'
    :'<button class="btn btn-sec" id="actualizar">Actualizar</button><button class="btn btn-sec" id="salir">Salir</button>');
  var ultB=idx.diasOrd.length?idx.diasOrd[0]:0, umb=diasDormido();
  var nDorm=equipo.filter(function(p){ return p.dUlt==null||(ultB-p.dUlt)>umb; }).length;
  var sub=esApoyos
    ? (equipo.length+" personas activas en labores distintas a cosecha"+(E.laborFiltro?" · "+E.laborFiltro:"")+
       " · de todos los líderes · datos al "+(diasEquipo.length?dmy(idx.msDe(diasEquipo[0])):"—")+(E.red?" · "+E.red:""))
    : ((equipo.length-nDorm)+" cosechando"+(nDorm?" · "+nDorm+" sin cosechar hace semanas":"")+
       (excluidos?" · "+excluidos+" en otra labor":"")+
       " · datos al "+(diasEquipo.length?dmy(idx.msDe(diasEquipo[0])):"—")+(E.red?" · "+E.red:""));
  var titulo=esApoyos?"Apoyos":(comoAdmin?("Equipo de "+lider):lider);
  var s='<div class="pantalla">'+htmlCab(titulo,sub,botones);

  /* --- detalle de una persona --- */
  if(E.personaSel!=null){
    s+=vistaDetalle(idx.personas[E.personaSel],regsEquipo,equipo);
    return s+"</div>";
  }

  /* --- pestañas Rendimiento / Calidad / Apoyos / Bonificaciones --- */
  if(soloApoyos){
    s+='<div class="avisoapoyos">Personal activo cuya labor no es cosecha. Lo ve cualquier líder, sin importar a quién esté asignada la persona.</div>';
  } else {
    var pestBoni=idx.meta&&idx.meta.tieneBoni;
    s+='<div class="pestanas">'+
      '<button class="pest'+(E.vista==="rend"?" pest-on":"")+'" data-vista="rend">Rendimiento</button>'+
      '<button class="pest'+(E.vista==="cal"?" pest-on":"")+'" data-vista="cal">Calidad</button>'+
      (pestBoni?('<button class="pest'+(E.vista==="boni"?" pest-on":"")+'" data-vista="boni">Bonificaciones</button>'):"" )+
      '<button class="pest'+(E.vista==="apoyos"?" pest-on":"")+'" data-vista="apoyos">Apoyos</button></div>';
    if(esApoyos) s+='<div class="avisoapoyos">Personal activo en labores distintas a cosecha, de todos los líderes.</div>';
  }

  /* --- filtros --- */
  var chips=[["dia","Diario"],["semana","Semanal"],["mes","Mensual"],["anual","Anual"]].map(function(x){
    return '<button class="chip'+(E.periodo===x[0]?" chip-on":"")+'" data-periodo="'+x[0]+'">'+x[1]+'</button>';
  }).join("");
  var optDias=diasEquipo.slice(0,180).map(function(d){
    return '<option value="'+d+'"'+(d===dRef?" selected":"")+'>'+dmy(idx.msDe(d))+'</option>';
  }).join("");
  var optSem='<option value="">Semana del día ('+(ref.sem||"—")+')</option>'+idx.semOrd.map(function(x){
    return '<option value="'+x+'"'+(String(x)===String(E.semFiltro)?" selected":"")+'>'+x+'</option>';
  }).join("");
  var optPer='<option value="">'+(esApoyos?"Ver todos los apoyos":"Ver todo el equipo")+'</option>'+equipo.map(function(p){
    return '<option value="'+p.i+'">'+esc(p.nom)+'</option>';
  }).join("");
  if(esBoni) s='<div class="pantalla">'+htmlCab(titulo,sub,botones); // reset: la vista boni tiene su propia UI
  if(!esBoni) s+='<div class="barrafiltros"><div class="grupo">'+chips+'</div><div class="grupo">'+
    '<label class="lblmini" for="fdia">Día</label><select id="fdia" class="inp inp-mini">'+optDias+'</select>'+
    '<label class="lblmini" for="fsem">Semana</label><select id="fsem" class="inp inp-mini">'+optSem+'</select>'+
    '<label class="lblmini" for="fmes">Mes</label><select id="fmes" class="inp inp-mini">'+
      '<option value="">Mes del día ('+MESES[ref0.mes]+" "+ref0.anio+')</option>'+
      mesesEq.map(function(x){
        return '<option value="'+x+'"'+(String(x)===String(E.mesFiltro)?" selected":"")+'>'+MESES[x%12]+" "+Math.floor(x/12)+'</option>';
      }).join("")+'</select>'+
    '<label class="lblmini" for="fanio">Año</label><select id="fanio" class="inp inp-mini">'+
      '<option value="">Año del día (20'+ref0.ciclo+')</option>'+
      aniosEq.map(function(x){
        return '<option value="'+x+'"'+(String(x)===String(E.anioFiltro)?" selected":"")+'>ciclo 20'+x+'</option>';
      }).join("")+'</select>'+
    (esApoyos?('<label class="lblmini" for="flabor">Labor</label><select id="flabor" class="inp inp-mini inp-per">'+
      '<option value="">Todas las labores</option>'+laboresApoyo.map(function(l){
        return '<option value="'+esc(l)+'"'+(l===E.laborFiltro?" selected":"")+'>'+esc(l)+'</option>';
      }).join("")+'</select>'):"")+
    '<label class="lblmini" for="fper">Persona</label><select id="fper" class="inp inp-mini inp-per">'+optPer+'</select>'+
    '</div></div>';

  /* === BONIFICACIONES intercepta aquí, antes de KPIs y cinta === */
  if(!esBoni){
  var kd=agrega(regsEquipo.filter(filtroPeriodo("dia",ref)));
  var ks=agrega(regsEquipo.filter(function(r){ return r.sem===semActiva; }));
  var km=agrega(regsEquipo.filter(filtroPeriodo("mes",ref)));
  var ka=agrega(regsEquipo.filter(filtroPeriodo("anual",ref)));

  s+='<div class="metasbarra">Metas de la finca: <b>'+fInt(mR)+' esq/h</b> y <b>'+fPct(mC)+' de calidad</b></div>';
  s+='<div class="kpis">'+
    htmlKpiDoble("Hoy · "+dmy(ref.ms),kd.r,kd.cf,fInt(kd.esq)+" esquejes · "+f1(kd.hor)+" h",true,esCal)+
    htmlKpiDoble("Semana "+(semActiva||"—"),ks.r,ks.cf,fInt(ks.esq)+" esquejes",false,esCal)+
    htmlKpiDoble("Mes · "+MESES[ref.mes]+" "+ref.anio,km.r,km.cf,fInt(km.esq)+" esquejes",false,esCal)+
    htmlKpiDoble("Año · ciclo 20"+ref.ciclo,ka.r,ka.cf,fInt(ka.esq)+" esquejes",false,esCal)+
    '</div>';

  /* --- una fila por persona en el período elegido --- */
  var fPer=filtroPeriodo(E.periodo,{d:ref.d,sem:semActiva,anio:ref.anio,mes:ref.mes,ciclo:ref.ciclo});
  var acc=new Map();
  regsEquipo.forEach(function(r){
    if(!fPer(r)) return;
    if(r.esq<=0&&!(r.hor>0)) return; // fila realmente vacía
    if(!acc.has(r.p)) acc.set(r.p,{esq:0,hor:0,cf:0,ncf:0,n:0,faltaHora:false,faltaEsq:false});
    var a=acc.get(r.p); a.esq+=r.esq; a.hor+=r.hor; a.n++;
    if(r.esq>0&&!(r.hor>0)) a.faltaHora=true;
    if(r.hor>0&&r.esq<=0) a.faltaEsq=true;
    if(r.cf!=null&&r.cf>0){ a.cf+=r.cf; a.ncf++; }
  });
  var ultBase=idx.diasOrd.length?idx.diasOrd[0]:0, umbral=diasDormido();
  function dormido(p){ return !esApoyos&&(p.dUlt==null||(ultBase-p.dUlt)>umbral); }
  var todasFilas=[], sinRegistro=[], dormidos=[];
  equipo.forEach(function(p){
    var a=acc.get(p.i);
    /* Esquejes sin horas: el rendimiento sube en vez de desaparecer,
       para que salte a la vista que falta digitar la hora. */
    if(a&&a.esq>0&&a.hor>0){ todasFilas.push({ k:p.i, nom:p.nom, v:a.esq/a.hor, cf:a.ncf?a.cf/a.ncf:null, esq:a.esq, dias:a.n, aviso:(a.faltaHora?"falta_hora":(a.faltaEsq?"falta_esq":null)) }); return; }
    if(a&&a.esq>0&&!(a.hor>0)){ todasFilas.push({ k:p.i, nom:p.nom, v:null, cf:a.ncf?a.cf/a.ncf:null, esq:a.esq, dias:a.n, sinHoras:true, aviso:"falta_hora" }); return; }
    if(dormido(p)) dormidos.push(p); else sinRegistro.push(p);
  });
  var cuenta={ambas:0,solo_r:0,solo_c:0,ninguna:0};
  todasFilas.forEach(function(f){
    var okR=f.v>=mR, okC=(f.cf!=null&&f.cf>=mC);
    if(okR&&okC) cuenta.ambas++; else if(okR) cuenta.solo_r++; else if(okC) cuenta.solo_c++; else cuenta.ninguna++;
  });
  var filas=todasFilas.filter(function(f){
    if(E.cump==="todos") return true;
    var okR=f.v>=mR, okC=(f.cf!=null&&f.cf>=mC);
    if(E.cump==="ambas") return okR&&okC;
    if(E.cump==="solo_r") return okR&&!okC;
    if(E.cump==="solo_c") return !okR&&okC;
    return !okR&&!okC;
  });
  if(E.orden==="rend") filas.sort(function(a,b){ return b.v-a.v; });
  else if(E.orden==="cal") filas.sort(function(a,b){ return (b.cf==null?-1:b.cf)-(a.cf==null?-1:a.cf); });
  else filas.sort(function(a,b){ return a.nom.localeCompare(b.nom,"es"); });

  var conAviso=todasFilas.filter(function(f){ return f.aviso; });
  var etiqPer={dia:"del día",semana:"de la semana",mes:"del mes",anual:"del año"}[E.periodo];

  } // fin if(!esBoni)

  /* === VISTA BONIFICACIONES === */
  if(esBoni){
    var semanas=Array.from(new Set(regsEquipo.map(function(r){ return r.sem; }))).sort(function(a,b){ return b-a; });
    var semB=E.semFiltro?+E.semFiltro:(semanas.length?semanas[0]:0);
    var regsB=regsEquipo.filter(function(r){ return r.sem===semB; });
    var porPersonaB=new Map();
    regsB.forEach(function(r){
      if(!porPersonaB.has(r.p)) porPersonaB.set(r.p,{boni:0,esq:0,hor:0,n:0});
      var a=porPersonaB.get(r.p);
      if(r.boni>0&&a.boni===0) a.boni=r.boni;
      a.esq+=r.esq; if(r.hor>0) a.hor+=r.hor; a.n++;
    });
    var filasB=equipo
      .map(function(p){
        var a=porPersonaB.get(p.i)||{boni:0,esq:0,hor:0,n:0};
        return { i:p.i, nom:p.nom, boni:a.boni, esq:a.esq, hor:a.hor, r:a.hor>0?a.esq/a.hor:null };
      })
      .sort(function(a,b){ return norm(a.nom).localeCompare(norm(b.nom),"es"); }); // orden alfabético sin tildes
    /* filtro por nombre */
    var qBoni=E.buscarBoni?norm(E.buscarBoni):"";
    var filasBFilt=qBoni?filasB.filter(function(f){ return norm(f.nom).indexOf(qBoni)>=0; }):filasB;
    var conBoni=filasBFilt.filter(function(f){ return f.boni>0; });
    var sinBoni=filasBFilt.filter(function(f){ return f.boni===0; });
    var totalB=conBoni.reduce(function(s,f){ return s+f.boni; },0);
    var optSemB=semanas.slice(0,60).map(function(x){
      return '<option value="'+x+'"'+(x===semB?" selected":"")+'>'+x+'</option>';
    }).join("");
    /* filtros: semana (propio, no comparte con el de arriba) y buscador de nombre */
    s+='<div class="barrafiltros"><div class="grupo">'+
      '<label class="lblmini" for="fsemboni">Semana</label>'+
      '<select id="fsemboni" class="inp inp-mini">'+optSemB+'</select>'+
      '</div><div class="grupo">'+
      '<input class="inp inp-mini inp-per" id="buscarboni" type="text" placeholder="Buscar por nombre…" value="'+esc(E.buscarBoni||"")+'">'+
      '</div></div>';
    s+='<div class="metasbarra">Semana <b>'+semB+'</b> · '+fInt(conBoni.length)+' personas con bonificación'+
      (qBoni?" (filtrado)":"")+' · total equipo <b>$'+nfInt.format(totalB)+'</b></div>';
    s+='<section class="tarj"><h3 class="tarjtit">Bonificación por persona · semana '+semB+
      '<span class="tarjsub">orden alfabético</span></h3>'+
      '<div class="tablabox"><table class="tabla"><thead><tr>'+
      '<th>Nombre</th><th class="num">Bonificación</th></tr></thead><tbody>'+
      conBoni.map(function(f){
        return '<tr><td><button class="link-persona" data-persona="'+f.i+'">'+esc(corto(f.nom))+'</button></td>'+
          '<td class="num fuerte">$'+nfInt.format(f.boni)+'</td></tr>';
      }).join("")+
      (sinBoni.length?('<tr><td colspan="2" class="mini" style="color:var(--muted);padding-top:10px">'+
        fInt(sinBoni.length)+' sin bonificación'+(!qBoni?" esta semana":"")+': '+
        sinBoni.map(function(f){ return esc(corto(f.nom)); }).join(" · ")+'</td></tr>'):"") +
      '</tbody></table></div></section>';
    if(comoAdmin){
      s+='<div class="boni-volver"><button class="btn btn-sec" id="volveradmin">← Volver al panel</button></div>';
    }
    return s+"</div>";
  }
  /* === FIN BONIFICACIONES === */
  var grupos=[["todos","Todos",todasFilas.length],["ambas","Cumplen las dos",cuenta.ambas],
    ["solo_r","Solo rendimiento",cuenta.solo_r],["solo_c","Solo calidad",cuenta.solo_c],
    ["ninguna","Ninguna de las dos",cuenta.ninguna]];

  s+='<section class="tarj"><h3 class="tarjtit">'+(esCal?"Calidad":"Rendimiento")+' de cada persona '+etiqPer+
    (esApoyos?" · apoyos":"")+
    '<span class="tarjsub">'+(esCal?("la marca amarilla es la meta de "+fPct(mC)):("la marca amarilla es la meta de "+fInt(mR)+" esq/h"))+
    ' · orden alfabético por apellido</span></h3>'+
    '<div class="grupos">'+grupos.map(function(g){
      return '<button class="gchip'+(E.cump===g[0]?" gchip-on":"")+' g-'+g[0]+'" data-cump="'+g[0]+'">'+
        '<b>'+g[2]+'</b><span>'+g[1]+'</span></button>';
    }).join("")+'</div>'+
    '<div class="grupo grupo-wrap ordenbar"><span class="lblmini">Ordenar por</span>'+
    '<button class="chip'+(E.orden==="apellido"?" chip-on":"")+'" data-orden="apellido">Apellido</button>'+
    '<button class="chip'+(E.orden==="rend"?" chip-on":"")+'" data-orden="rend">Rendimiento</button>'+
    '<button class="chip'+(E.orden==="cal"?" chip-on":"")+'" data-orden="cal">Calidad</button></div>'+
    (filas.length?htmlCinta(filas,esCal?"cal":"rend"):'<div class="vacio">Ninguna persona en este grupo.</div>')+
    (!esApoyos&&sinRegistro.length?('<div class="sinreg"><b>'+sinRegistro.length+' sin registro '+etiqPer+':</b> '+
      sinRegistro.map(function(p){ return esc(corto(p.nom)); }).join(" · ")+'</div>'):"")+
    (!esApoyos&&dormidos.length?('<div class="sinreg dormidos"><b>'+dormidos.length+' sin cosechar hace más de '+
      Math.round(umbral/7)+' semanas:</b> '+dormidos.sort(function(a,b){ return (a.dUlt||0)-(b.dUlt||0); }).map(function(p){
        return esc(corto(p.nom))+" ("+(p.dUlt==null?"sin registros":(ultBase-p.dUlt)+" días)");
      }).join(" · ")+'. Siguen como LABORANDO en el maestro. Revisa si ya salieron o cambiaron de labor.</div>'):"")+
    (conAviso.length?('<div class="sinreg aviso"><b>⚠ '+conAviso.length+' con un dato faltante '+etiqPer+':</b> '+
      conAviso.map(function(f){
        return esc(corto(f.nom))+(f.aviso==="falta_hora"
          ? " (le falta la hora de un día: su rendimiento sale más alto de lo real)"
          : " (le falta digitar esquejes de un día: su rendimiento sale más bajo de lo real)");
      }).join(" · ")+'. Corrige en el Excel y vuelve a cargar el día.</div>'):"")+
    '</section>';

  /* --- gráfico del equipo --- */
  var mapa=new Map(), claves, serie;
  function acumula(clave,r){ if(!mapa.has(clave)) mapa.set(clave,[]); mapa.get(clave).push(r); }
  if(E.periodo==="dia"||E.periodo==="semana"){
    regsEquipo.forEach(function(r){ if(r.sem===semActiva) acumula(r.d,r); });
    claves=Array.from(mapa.keys()).sort(function(a,b){ return a-b; });
    serie=claves.map(function(d){
      var ag=agrega(mapa.get(d)), ms=idx.msDe(d);
      return { k:d, label:DIA_NOMBRE[new Date(ms).getUTCDay()], sub:dm(ms),
        v:esCal?(ag.cf==null?null:ag.cf*100):ag.r, hl:d===ref.d };
    });
  } else if(E.periodo==="mes"){
    regsEquipo.forEach(function(r){ if(r.anio===ref.anio&&r.mes===ref.mes) acumula(r.sem,r); });
    claves=Array.from(mapa.keys()).sort(function(a,b){ return a-b; });
    serie=claves.map(function(x){
      var ag=agrega(mapa.get(x));
      return { k:x, label:"S"+String(x).slice(2), v:esCal?(ag.cf==null?null:ag.cf*100):ag.r, hl:x===semActiva };
    });
  } else {
    regsEquipo.forEach(function(r){ if(r.ciclo===ref.ciclo) acumula(r.anio*12+r.mes,r); });
    claves=Array.from(mapa.keys()).sort(function(a,b){ return a-b; });
    serie=claves.map(function(x){
      var ag=agrega(mapa.get(x));
      return { k:x, label:MESES[x%12], v:esCal?(ag.cf==null?null:ag.cf*100):ag.r, hl:x===ref.anio*12+ref.mes };
    });
  }
  var tituloChart=(E.periodo==="dia"||E.periodo==="semana")?("Día por día · semana "+semActiva)
    :(E.periodo==="mes"?("Semana por semana · "+MESES[ref.mes]+" "+ref.anio):("Mes por mes · ciclo 20"+ref.ciclo));
  s+='<section class="tarj"><h3 class="tarjtit">'+esc(tituloChart)+
    '<span class="tarjsub">'+(esCal?"calidad promedio del equipo, %":"promedio del equipo, esquejes por hora")+'</span></h3>'+
    svgBarras(serie,{ refLinea:esCal?mC*100:mR, etiquetaRef:"meta",
      refLinea2:esCal?(ka.cf?ka.cf*100:null):ka.r, etiquetaRef2:"prom. equipo" })+'</section>';

  /* --- podios, al final para no estorbar en el informe --- */
  var accD=new Map();
  regsEquipo.forEach(function(r){
    if(r.d!==ref.d) return;
    if(r.esq<=0&&!(r.hor>0)) return;
    if(!accD.has(r.p)) accD.set(r.p,{esq:0,hor:0,cf:0,ncf:0});
    var a=accD.get(r.p); a.esq+=r.esq; a.hor+=r.hor;
    if(r.cf!=null&&r.cf>0){ a.cf+=r.cf; a.ncf++; }
  });
  var rankDia=[];
  accD.forEach(function(a,p){ if(a.hor>0) rankDia.push({ k:p, nom:idx.personas[p].nom, v:a.esq/a.hor, cf:a.ncf?a.cf/a.ncf:null }); });
  if(esCal) rankDia=rankDia.filter(function(x){ return x.cf!=null; }).sort(function(a,b){ return b.cf-a.cf; });
  else rankDia.sort(function(a,b){ return b.v-a.v; });
  s+='<div class="rejilla2">'+
    '<section class="tarj tarj-tenue"><h3 class="tarjtit">Mejores 3 '+(esCal?"en calidad":"en rendimiento")+
    '<span class="tarjsub">'+dmy(ref.ms)+'</span></h3>'+htmlPodio(rankDia.slice(0,3),false,esCal)+'</section>'+
    '<section class="tarj tarj-tenue"><h3 class="tarjtit">Requieren acompañamiento'+
    '<span class="tarjsub">3 más bajos del día</span></h3>'+htmlPodio(rankDia.slice(-3).reverse(),true,esCal)+'</section></div>';

  return s+"</div>";
}

/* Detalle de una persona, con sus propios filtros de día, semana, mes y año. */
function vistaDetalle(persona,equipoRegs,equipo){
  var idx=E.idx, mR=metaRend(), mC=metaCal();
  var hist=idx.porPersona.get(persona.i)||[];
  if(!hist.length){
    return '<div class="detcab"><button class="btn btn-sec" id="volverequipo">← Volver al equipo</button></div>'+
      '<div class="vacio">'+esc(persona.nom)+' no tiene registros en la base.</div>';
  }

  var dias=Array.from(new Set(hist.map(function(r){ return r.d; }))).sort(function(a,b){ return b-a; });
  var sems=Array.from(new Set(hist.map(function(r){ return r.sem; }))).sort(function(a,b){ return b-a; });
  var meses=Array.from(new Set(hist.map(function(r){ return r.anio*12+r.mes; }))).sort(function(a,b){ return b-a; });
  var anios=Array.from(new Set(hist.map(function(r){ return r.ciclo; }))).sort(function(a,b){ return b-a; });

  var per=E.detPeriodo||"dia";
  var lista=(per==="dia")?dias:(per==="semana")?sems:(per==="mes")?meses:anios;
  var clave=(E.detClave!=null&&lista.indexOf(E.detClave)>=0)?E.detClave:lista[0];
  var filtro=(per==="dia")?function(r){ return r.d===clave; }
    :(per==="semana")?function(r){ return r.sem===clave; }
    :(per==="mes")?function(r){ return r.anio*12+r.mes===clave; }
    :function(r){ return r.ciclo===clave; };

  function etiqueta(p,c){
    if(p==="dia") return dmy(idx.msDe(c));
    if(p==="semana") return "Semana "+c;
    if(p==="mes") return MESES[c%12]+" "+Math.floor(c/12);
    return "Ciclo 20"+c;
  }

  var mio=agrega(hist.filter(filtro));
  var eqAg=agrega(equipoRegs.filter(filtro));
  var difEq=(mio.r&&eqAg.r)?(mio.r/eqAg.r-1):null;
  var registros=hist.filter(filtro).sort(function(a,b){ return b.d-a.d; });
  var faltanHoras=registros.filter(function(r){ return r.esq>0&&!(r.hor>0); });
  var faltanEsq=registros.filter(function(r){ return r.hor>0&&r.esq<=0; });

  var s='<div class="detcab"><button class="btn btn-sec" id="volverequipo">← Volver al equipo</button>'+
    '<button class="btn btn-pri btn-mostrar" id="mostrar" data-p="'+persona.i+'">Mostrar a la persona</button>'+
    '<div><div class="detnomtit">'+esc(persona.nom)+'</div>'+
    '<div class="detnomsub">Código '+persona.cod+' · '+esc(persona.labor)+' · líder actual '+esc(persona.lider)+
    (persona.semUlt?" (por la semana "+persona.semUlt+")":"")+'</div></div></div>';

  /* filtros propios de la persona */
  s+='<div class="barrafiltros"><div class="grupo">'+
    [["dia","Día"],["semana","Semana"],["mes","Mes"],["anual","Año"]].map(function(x){
      return '<button class="chip'+(per===x[0]?" chip-on":"")+'" data-detper="'+x[0]+'">'+x[1]+'</button>';
    }).join("")+'</div><div class="grupo">'+
    '<label class="lblmini" for="fdetclave">'+(per==="dia"?"Fecha":per==="semana"?"Semana":per==="mes"?"Mes":"Ciclo")+'</label>'+
    '<select id="fdetclave" class="inp inp-mini">'+lista.slice(0,240).map(function(c){
      return '<option value="'+c+'"'+(c===clave?" selected":"")+'>'+esc(etiqueta(per,c))+'</option>';
    }).join("")+'</select></div></div>';

  s+='<div class="metasbarra">'+esc(etiqueta(per,clave))+' · metas <b>'+fInt(mR)+' esq/h</b> y <b>'+fPct(mC)+'</b></div>';
  if(faltanHoras.length) s+='<div class="sinreg aviso">⚠ Le falta la hora en '+faltanHoras.length+
    (faltanHoras.length===1?' día':' días')+' de '+esc(etiqueta(per,clave))+': '+
    faltanHoras.map(function(r){ return dmy(r.ms)+" ("+fInt(r.esq)+" esquejes)"; }).join(" · ")+
    '. Esos esquejes ya están sumados al total, pero el esq/h de este período sale más alto de lo real. Corrige la hora en el Excel.</div>';
  if(faltanEsq.length) s+='<div class="sinreg aviso">⚠ Tiene horas sin esquejes en '+faltanEsq.length+
    (faltanEsq.length===1?' día':' días')+' de '+esc(etiqueta(per,clave))+': '+
    faltanEsq.map(function(r){ return dmy(r.ms)+" ("+f1(r.hor)+" horas)"; }).join(" · ")+
    '. Eso baja el esq/h de este período. Revisa si faltó digitar los esquejes.</div>';

  s+='<div class="kpis">'+
    htmlKpi("Esquejes cosechados",fInt(mio.esq),"",f1(mio.hor)+" horas · "+mio.n+(mio.n===1?" día":" días"),true,"")+
    htmlKpi("Rendimiento",fInt(mio.r),"esq/h","meta "+fInt(mR)+" · equipo "+fInt(eqAg.r)+" ("+difTxt(difEq)+")",false,claseMeta(mio.r,mR))+
    htmlKpi("Calidad",fPct(mio.cf),"","meta "+fPct(mC)+" · equipo "+fPct(eqAg.cf),false,claseMeta(mio.cf,mC))+
    htmlKpi("Su posición en el equipo",posicionEquipo(persona,equipo,filtro),"","por rendimiento en este período",false,"")+
    '</div>';

  /* gráficos del período elegido: rendimiento y calidad, uno al lado del otro */
  var mapa=new Map(), etiquetas=[];
  function acum(k,r){ if(!mapa.has(k)) mapa.set(k,[]); mapa.get(k).push(r); }
  if(per==="dia"){
    var desde=clave-13;
    hist.forEach(function(r){ if(r.d>=desde&&r.d<=clave) acum(r.d,r); });
    for(var d=desde;d<=clave;d++){
      var ms=idx.msDe(d);
      etiquetas.push({ k:d, label:String(new Date(ms).getUTCDate()), sub:MESES[new Date(ms).getUTCMonth()], hl:d===clave });
    }
  } else if(per==="semana"){
    hist.forEach(function(r){ if(r.sem===clave) acum(r.d,r); });
    Array.from(mapa.keys()).sort(function(a,b){ return a-b; }).forEach(function(d){
      var ms=idx.msDe(d);
      etiquetas.push({ k:d, label:DIA_NOMBRE[new Date(ms).getUTCDay()], sub:dm(ms), hl:false });
    });
  } else if(per==="mes"){
    hist.forEach(function(r){ if(r.anio*12+r.mes===clave) acum(r.sem,r); });
    Array.from(mapa.keys()).sort(function(a,b){ return a-b; }).forEach(function(x){
      etiquetas.push({ k:x, label:"S"+String(x).slice(2), hl:false });
    });
  } else {
    hist.forEach(function(r){ if(r.ciclo===clave) acum(r.anio*12+r.mes,r); });
    Array.from(mapa.keys()).sort(function(a,b){ return a-b; }).forEach(function(x){
      etiquetas.push({ k:x, label:MESES[x%12], hl:false });
    });
  }
  var serieR=etiquetas.map(function(e){
    var l=mapa.get(e.k), ag=l?agrega(l):null;
    return { k:e.k, label:e.label, sub:e.sub, hl:e.hl, v:ag?ag.r:null };
  });
  var serieC=etiquetas.map(function(e){
    var l=mapa.get(e.k), ag=l?agrega(l):null;
    return { k:e.k, label:e.label, sub:e.sub, hl:e.hl, v:(ag&&ag.cf!=null)?ag.cf*100:null };
  });
  s+='<div class="rejilla2">'+
    '<section class="tarj"><h3 class="tarjtit">Rendimiento<span class="tarjsub">esquejes por hora · línea amarilla, la meta</span></h3>'+
    svgBarras(serieR,{refLinea:mR,etiquetaRef:"meta",refLinea2:eqAg.r,etiquetaRef2:"equipo"})+'</section>'+
    '<section class="tarj"><h3 class="tarjtit">Calidad<span class="tarjsub">conformidad en % · línea amarilla, la meta</span></h3>'+
    svgBarras(serieC,{refLinea:mC*100,etiquetaRef:"meta",color:"var(--deep2)"})+'</section></div>';

  /* fichas de la persona */
  var sems4=sems.slice(0,4), sems8=sems.slice(4,8);
  var ra=agrega(hist.filter(function(r){ return sems4.indexOf(r.sem)>=0; })).r;
  var rb=agrega(hist.filter(function(r){ return sems8.indexOf(r.sem)>=0; })).r;
  var tend=(ra&&rb)?(ra/rb-1):null;
  var vida=agrega(hist);
  s+='<div class="fichas">'+
    htmlFicha("Ingreso a la finca",dmy(persona.ingreso))+
    htmlFicha("Experiencia",esc(persona.exp))+
    htmlFicha("Estado",persona.activo?"Laborando":"Retirado")+
    htmlFicha("Histórico completo",fInt(vida.r)+" esq/h · "+fPct(vida.cf))+
    htmlFicha("Registros en la base",fInt(hist.length))+
    htmlFicha("Tendencia 4 sem vs 4 sem",tend==null?"—":((tend>=0?"▲ +":"▼ ")+nf1.format(tend*100)+"%"),
      tend==null?null:(tend>=0?"alto":"bajo"))+
    '</div>';

  /* tabla de los registros del período */
  var filasR="";
  registros.forEach(function(r){
    filasR+='<tr><td>'+dmy(r.ms)+'</td><td class="num">'+r.sem+'</td><td>Día '+r.dia+'</td>'+
      '<td class="num">'+fInt(r.esq)+'</td><td class="num">'+f1(r.hor)+'</td>'+
      '<td class="num fuerte '+(r.r?(r.r>=mR?"t-alto":"t-bajo"):"")+'">'+(r.r?fInt(r.r):"—")+'</td>'+
      '<td class="num">'+chipCal(r.cf,mC)+'</td><td class="mini">'+esc(corto(r.lider))+'</td></tr>';
  });
  s+='<section class="tarj"><h3 class="tarjtit">Registros de '+esc(etiqueta(per,clave))+
    '<span class="tarjsub">'+registros.length+(registros.length===1?" registro":" registros")+'</span></h3>'+
    '<div class="tablabox"><table class="tabla"><thead><tr><th>Fecha</th><th class="num">Semana</th><th>Día</th>'+
    '<th class="num">Esquejes</th><th class="num">Horas</th><th class="num">esq/h</th>'+
    '<th class="num">Calidad</th><th>Líder</th></tr></thead><tbody>'+filasR+'</tbody></table></div></section>';

  /* histórico por líder */
  var ml=new Map();
  hist.forEach(function(r){
    if(!ml.has(r.lider)) ml.set(r.lider,{n:0,desde:r.ms,hasta:r.ms,esq:0,hor:0,cf:0,ncf:0});
    var a=ml.get(r.lider); a.n++; a.hasta=r.ms; a.esq+=r.esq; a.hor+=r.hor;
    if(r.cf!=null&&r.cf>0){ a.cf+=r.cf; a.ncf++; }
  });
  var filasL="";
  ml.forEach(function(a,l){
    filasL+='<tr><td>'+esc(l)+'</td><td>'+dmy(a.desde)+'</td><td>'+dmy(a.hasta)+'</td>'+
      '<td class="num">'+fInt(a.n)+'</td><td class="num">'+fInt(a.esq)+'</td>'+
      '<td class="num fuerte">'+fInt(a.hor>0?a.esq/a.hor:null)+'</td>'+
      '<td class="num">'+(a.ncf?fPct(a.cf/a.ncf):"—")+'</td></tr>';
  });
  s+='<section class="tarj tarj-tenue"><h3 class="tarjtit">Histórico por líder'+
    '<span class="tarjsub">se conserva aunque haya cambiado de equipo</span></h3>'+
    '<div class="tablabox"><table class="tabla"><thead><tr><th>Líder</th><th>Desde</th><th>Hasta</th>'+
    '<th class="num">Registros</th><th class="num">Esquejes</th><th class="num">esq/h</th>'+
    '<th class="num">Calidad</th></tr></thead><tbody>'+filasL+'</tbody></table></div></section>';
  return s;
}

function posicionEquipo(persona,equipo,filtro){
  if(!equipo||!equipo.length) return "—";
  var idx=E.idx, arr=[];
  equipo.forEach(function(p){
    var ag=agrega((idx.porPersona.get(p.i)||[]).filter(filtro));
    if(ag.r) arr.push({ i:p.i, r:ag.r });
  });
  arr.sort(function(a,b){ return b.r-a.r; });
  for(var k=0;k<arr.length;k++) if(arr[k].i===persona.i) return (k+1)+" de "+arr.length;
  return "sin registro";
}

/* Pantalla para voltear la tablet y mostrarle a la persona su desempeño.
   Con filtros de día, semana, mes y año. Sin ranking ni otros nombres. */
function vistaCosechador(persona){
  var idx=E.idx, mR=metaRend(), mC=metaCal();
  var hist=idx.porPersona.get(persona.i)||[];
  var conH=hist.filter(function(r){ return r.hor>0; });
  if(!conH.length){
    return '<div class="show"><button class="btn btn-sec show-cerrar" id="cerrarshow">Cerrar</button>'+
      '<div class="shownom">'+esc(persona.nom)+'</div>'+
      '<div class="vacio">Esta persona no tiene registros de cosecha con horas.</div></div>';
  }

  var dias=Array.from(new Set(conH.map(function(r){ return r.d; }))).sort(function(a,b){ return b-a; });
  var sems=Array.from(new Set(conH.map(function(r){ return r.sem; }))).sort(function(a,b){ return b-a; });
  var meses=Array.from(new Set(conH.map(function(r){ return r.anio*12+r.mes; }))).sort(function(a,b){ return b-a; });
  var anios=Array.from(new Set(conH.map(function(r){ return r.ciclo; }))).sort(function(a,b){ return b-a; });

  var per=E.showPeriodo||"dia";
  var lista=(per==="dia")?dias:(per==="semana")?sems:(per==="mes")?meses:anios;
  var clave=(E.showClave!=null&&lista.indexOf(E.showClave)>=0)?E.showClave:lista[0];
  var pos=lista.indexOf(clave);
  var claveAnt=(pos>=0&&pos+1<lista.length)?lista[pos+1]:null;

  function fn(c){
    if(per==="dia") return function(r){ return r.d===c; };
    if(per==="semana") return function(r){ return r.sem===c; };
    if(per==="mes") return function(r){ return r.anio*12+r.mes===c; };
    return function(r){ return r.ciclo===c; };
  }
  function etiqueta(c){
    if(per==="dia") return dmy(idx.msDe(c));
    if(per==="semana") return "semana "+c;
    if(per==="mes") return MESES[c%12]+" de "+Math.floor(c/12);
    return "ciclo 20"+c;
  }
  var titulos={dia:["Esquejes del día","Cosecha del"],semana:["Esquejes de la semana","Cosecha de la"],
    mes:["Esquejes del mes","Cosecha de"],anual:["Esquejes del año","Cosecha del"]};

  var ag=agrega(hist.filter(fn(clave)));
  var agAnt=(claveAnt!=null)?agrega(hist.filter(fn(claveAnt))):null;

  function bloque(eyebrow,valor,unidad,meta,pie,ok){
    return '<div class="showcaja '+(ok==null?"s-neutro":(ok?"s-ok":"s-no"))+'">'+
      '<div class="showeye">'+esc(eyebrow)+'</div>'+
      '<div class="showval">'+valor+(unidad?'<span class="showun">'+esc(unidad)+'</span>':"")+'</div>'+
      '<div class="showmeta">'+esc(meta)+'</div>'+
      '<div class="showpie">'+esc(pie)+'</div></div>';
  }

  var faltaR=(ag.r!=null)?(mR-ag.r):null;
  var pieR=(ag.r==null)?"sin dato":(faltaR<=0?("va "+fInt(-faltaR)+" por encima de la meta"):("le faltan "+fInt(faltaR)+" por hora"));
  var faltaC=(ag.cf!=null)?(mC-ag.cf):null;
  var pieC=(ag.cf==null)?"sin dato":(faltaC<=0?("va "+nf1.format(-faltaC*100)+" puntos por encima"):("le faltan "+nf1.format(faltaC*100)+" puntos"));

  var s='<div class="show">'+
    '<button class="btn btn-sec show-cerrar" id="cerrarshow">Cerrar</button>'+
    '<div class="shownom">'+esc(persona.nom)+'</div>'+
    '<div class="showfecha">'+esc(titulos[per][1])+' '+esc(etiqueta(clave))+
    (per==="dia"?(" · semana "+(hist.filter(fn(clave))[0]||{}).sem):"")+'</div>';

  /* filtros de la pantalla */
  s+='<div class="showfiltros"><div class="grupo">'+
    [["dia","Día"],["semana","Semana"],["mes","Mes"],["anual","Año"]].map(function(x){
      return '<button class="chip'+(per===x[0]?" chip-on":"")+'" data-showper="'+x[0]+'">'+x[1]+'</button>';
    }).join("")+'</div>'+
    '<select id="fshowclave" class="inp inp-mini">'+lista.slice(0,240).map(function(c){
      return '<option value="'+c+'"'+(c===clave?" selected":"")+'>'+esc(etiqueta(c))+'</option>';
    }).join("")+'</select></div>';

  s+='<div class="showcajas">'+
    bloque(titulos[per][0],fInt(ag.esq),"",f1(ag.hor)+" horas · "+ag.n+(ag.n===1?" día":" días"),"",null)+
    bloque("Por hora",fInt(ag.r),"esq/h","meta "+fInt(mR),pieR,cumple(ag.r,mR))+
    bloque("Calidad",fPct(ag.cf),"","meta "+fPct(mC),pieC,cumple(ag.cf,mC))+
    '</div>';

  if(agAnt&&agAnt.r&&ag.r){
    var d=ag.r/agAnt.r-1;
    var comoAnt={dia:"El día anterior",semana:"La semana pasada",mes:"El mes pasado",anual:"El año pasado"}[per];
    s+='<div class="showcomp '+(d>=0?"s-ok":"s-no")+'">'+(d>=0?"▲ ":"▼ ")+
      "Ahora va en "+fInt(ag.r)+" esq/h. "+comoAnt+" iba en "+fInt(agAnt.r)+". "+
      (d>=0?"Subió ":"Bajó ")+nf1.format(Math.abs(d)*100)+"%."+'</div>';
  }

  /* barras del período: días, semanas o meses según el filtro */
  var mapa=new Map(), etiquetas=[];
  function acum(k,r){ if(!mapa.has(k)) mapa.set(k,[]); mapa.get(k).push(r); }
  if(per==="dia"){
    var desde=clave-6;
    hist.forEach(function(r){ if(r.d>=desde&&r.d<=clave) acum(r.d,r); });
    for(var d2=desde;d2<=clave;d2++){
      var ms=idx.msDe(d2);
      etiquetas.push({ k:d2, label:DIA_NOMBRE[new Date(ms).getUTCDay()], sub:dm(ms), hl:d2===clave });
    }
    var subt="Sus últimos 7 días";
  } else if(per==="semana"){
    hist.forEach(function(r){ if(r.sem===clave) acum(r.d,r); });
    Array.from(mapa.keys()).sort(function(a,b){ return a-b; }).forEach(function(d3){
      var ms2=idx.msDe(d3);
      etiquetas.push({ k:d3, label:DIA_NOMBRE[new Date(ms2).getUTCDay()], sub:dm(ms2), hl:false });
    });
    subt="Día por día de la semana "+clave;
  } else if(per==="mes"){
    hist.forEach(function(r){ if(r.anio*12+r.mes===clave) acum(r.sem,r); });
    Array.from(mapa.keys()).sort(function(a,b){ return a-b; }).forEach(function(x){
      etiquetas.push({ k:x, label:"S"+String(x).slice(2), hl:false });
    });
    subt="Semana por semana de "+MESES[clave%12];
  } else {
    hist.forEach(function(r){ if(r.ciclo===clave) acum(r.anio*12+r.mes,r); });
    Array.from(mapa.keys()).sort(function(a,b){ return a-b; }).forEach(function(x){
      etiquetas.push({ k:x, label:MESES[x%12], hl:false });
    });
    subt="Mes por mes del ciclo 20"+clave;
  }
  var serie=etiquetas.map(function(e){
    var l=mapa.get(e.k), a=l?agrega(l):null;
    return { k:e.k, label:e.label, sub:e.sub, hl:e.hl, v:a?a.r:null };
  });
  s+='<div class="showchart"><div class="showeye">'+esc(subt)+' · esquejes por hora</div>'+
    svgBarras(serie,{refLinea:mR,etiquetaRef:"meta"})+'</div>';

  s+='<div class="showcalidad"><div class="showeye">Calidad en el mismo período</div><div class="showpuntos">';
  etiquetas.forEach(function(e){
    var l=mapa.get(e.k), a=l?agrega(l):null, cf=a?a.cf:null;
    s+='<div class="showpunto '+(cf==null?"s-neutro":(cf>=mC?"s-ok":"s-no"))+'">'+
      '<span class="showpdia">'+esc(e.sub||e.label)+'</span>'+
      '<span class="showpval">'+(cf==null?"—":fPct(cf))+'</span></div>';
  });
  s+='</div></div></div>';
  return s;
}

          return '<option value="'+n+'"'+(n===2?" selected":"")+'>'+(n===1?"solo el ciclo en curso":"los últimos "+n+" ciclos")+'</option>';
        }).join("")+'</select>'+
        '<button class="btn btn-mini" id="depurar">Depurar base</button></div>'+

    s+='<section class="tarj"><h3 class="tarjtit">Rendimiento por equipo de cosecha'+
